<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">qsh — new network, same session</title>
  <desc id="description">Wi-Fi and mobile data take different paths to one continuing terminal session. The mobile route and terminal cursor are highlighted in teal.</desc>
  <rect width="1200" height="300" rx="16" fill="#141415"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <text x="56" y="132" fill="#ededed" font-size="88" font-weight="500">qsh</text>
    <text x="56" y="192" fill="#ededed" font-size="24">New network. Same session.</text>
    <text x="56" y="236" fill="#a1a1a6" font-size="14">Encrypted UDP · local echo · session recovery</text>

    <text x="632" y="100" fill="#a1a1a6" font-size="16">Wi-Fi</text>
    <text x="632" y="212" fill="#ededed" font-size="16">Mobile</text>
    <g fill="none" stroke-width="2">
      <path d="M720 96H760Q784 96 784 120V128Q784 152 808 152H856" stroke="#85858b" stroke-dasharray="4 8"/>
      <path d="M720 208H760Q784 208 784 184V176Q784 152 808 152H856" stroke="#5eead4"/>
    </g>

    <rect x="856" y="76" width="288" height="152" rx="12" fill="#19191b" stroke="#38383c"/>
    <path d="M856 116H1144" stroke="#38383c"/>
    <text x="880" y="102" fill="#a1a1a6" font-size="13">Same session</text>
    <text x="880" y="156" fill="#ededed" font-size="16">$ work continues</text>
    <text x="880" y="196" fill="#a1a1a6" font-size="16">$</text>
    <rect x="900" y="180" width="8" height="20" fill="#5eead4"/>
  </g>
</svg>
