name: Release
run-name: ${{ github.ref_type == 'tag' && 'Release' || 'Build packages' }} ${{ github.ref_name }}

on:
  push:
    tags: ['v*.*.*']
  # Exercises build and packaging without publishing, unless run against
  # a tag ref — then the release steps run too, which is how a failed
  # publish gets retried.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.99.1"

# Least privilege by default: the `publish` job below grants itself
# `contents: write` explicitly to talk to GitHub's release API. Without a
# top-level `permissions`, a job with none of its own falls back to the
# repository's default token permissions -- "read and write" on every repo
# created before February 2023 -- so `cargo install` and the build scripts
# of every third-party crate pulled in below would otherwise run with a
# token that can push to this repository.
permissions:
  contents: read

jobs:
  # Tags must qualify the exact source, not a nearby main or PR merge commit.
  # Branch package runs do not publish or repeat the full ordinary suite.
  ordinary-ci:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # The same path-filtered CI qualification is mandatory for a release build.
  # Product builds below link this same verified native source statically.
  native-crypto:
    uses: ./.github/workflows/native-crypto.yml

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    env:
      NATIVE_TARGET: ${{ matrix.target }}
    # Building this native target and two package formats; a hang
    # here would otherwise burn the default 360 minutes before GitHub kills
    # the job.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Verify the exact source commit
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          echo "Source commit: $actual (run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT)"
          test "$actual" = "$GITHUB_SHA"

      - name: Install the toolchain and targets
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup target add "$NATIVE_TARGET"
          scripts/check-qualified-rust.sh

      - name: Validate the shipped pair version
        shell: bash
        run: |
          version=$(cargo metadata --locked --format-version 1 --no-deps \
            | python3 scripts/check-release-version.py \
                --ref-type "$GITHUB_REF_TYPE" --ref-name "$GITHUB_REF_NAME")
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      # v2.9.2, pinned by commit so a mutable tag can't change what a
      # release run does.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      # Build each musl target with its native musl compiler and kernel UAPI.
      - name: Install native musl and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools linux-libc-dev perl make gnupg rpm rpm2cpio cpio python3 patch curl
          # The RPM installer checksum-pins the selected tool and applies the
          # reviewed archive-size source fix identically to the server builder.
          cargo install 'cargo-deb@=3.8.0' --locked
          bash packaging/rpm-tool/install.sh

      - name: Build the pinned native backend and products
        run: |
          uapi="$RUNNER_TEMP/kernel-uapi"
          mkdir -p "$uapi"
          ln -s /usr/include/linux "$uapi/linux"
          ln -s /usr/include/asm-generic "$uapi/asm-generic"
          ln -s "/usr/include/$(gcc -dumpmachine)/asm" "$uapi/asm"
          native_prefix=$(bash scripts/build-openssl.sh --target "$NATIVE_TARGET" \
            --cache "$RUNNER_TEMP/native-crypto" --cflag=-idirafter --cflag="$uapi" --jobs 2)
          export OPENSSL_DIR="$native_prefix" OPENSSL_STATIC=1
          export CC=musl-gcc
          cargo build --release --locked -p qsh -p qshd --target "$NATIVE_TARGET"
          dynamic=$(readelf -d "target/$NATIVE_TARGET/release/qsh" "target/$NATIVE_TARGET/release/qshd")
          if grep -q NEEDED <<< "$dynamic"; then
            echo 'musl products unexpectedly import dynamic libraries' >&2
            exit 1
          fi
          strip "target/$NATIVE_TARGET/release/qsh" "target/$NATIVE_TARGET/release/qshd"

      - name: Package
        run: |
          VERSION="$RELEASE_VERSION"
          mkdir -p dist
          for target in "$NATIVE_TARGET"; do
            stage="qsh-$VERSION-$target"
            mkdir -p "$stage"
            cp "target/$target/release/qsh" "target/$target/release/qshd" "$stage/"
            cp README.md LICENSE CHANGELOG.md "$stage/"
            cp docs/licenses/openssl.txt "$stage/LICENSE-OPENSSL.txt"
            tar czf "dist/$stage.tar.gz" "$stage"
            # Probes both actual stripped inputs, then checks archived bytes.
            python3 scripts/check-release-output.py archive --version "$VERSION" \
              --target "$target" --inputs "$stage" "dist/$stage.tar.gz"
            # Archive inputs are already stripped; preserve their exact bytes.
            cargo deb -p qsh --target "$target" --no-build --no-strip
            cargo generate-rpm -p cli --target "$target"
          done
          cp target/*/debian/*.deb dist/
          cp target/*/generate-rpm/*.rpm dist/
          case "$NATIVE_TARGET" in
            x86_64-*) deb_arch=amd64; rpm_arch=x86_64 ;;
            aarch64-*) deb_arch=arm64; rpm_arch=aarch64 ;;
            *) echo 'unsupported package architecture' >&2; exit 1 ;;
          esac
          for package in dist/*.deb; do
            python3 scripts/check-release-output.py package --format deb --program qsh \
              --version "$VERSION" --arch "$deb_arch" --probe "$package"
          done
          for package in dist/*.rpm; do
            python3 scripts/check-release-output.py package --format rpm --program qsh \
              --version "$VERSION" --arch "$rpm_arch" --probe "$package"
          done

      - name: Exercise shipped Linux clients before upload
        shell: bash
        run: |
          case "$NATIVE_TARGET" in
            x86_64-*) deb_arch=amd64; rpm_arch=x86_64 ;;
            aarch64-*) deb_arch=arm64; rpm_arch=aarch64 ;;
            *) echo 'unsupported client runtime architecture' >&2; exit 1 ;;
          esac
          deb_version=$(python3 -c 'import runpy,sys; print(runpy.run_path("scripts/check-release-output.py")["debian_version"](sys.argv[1]))' "$RELEASE_VERSION")
          archive="dist/qsh-$RELEASE_VERSION-$NATIVE_TARGET.tar.gz"
          python3 packaging/client-acceptance.py --archive "$archive" \
            --version "$RELEASE_VERSION" --target "$NATIVE_TARGET"
          python3 packaging/client-acceptance.py --archive "$archive" \
            --package "dist/qsh_${deb_version}_${deb_arch}.deb" \
            --version "$RELEASE_VERSION" --target "$NATIVE_TARGET"
          python3 packaging/client-acceptance.py --archive "$archive" \
            --package "dist/qsh-$RELEASE_VERSION-1.$rpm_arch.rpm" \
            --version "$RELEASE_VERSION" --target "$NATIVE_TARGET"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.target }}
          path: dist/

  macos:
    runs-on: macos-14
    # Both architectures build on one runner and must execute there; see the
    # `linux` job's timeout for why this is bounded at all.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Verify the exact source commit
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          echo "Source commit: $actual (run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT)"
          test "$actual" = "$GITHUB_SHA"

      - name: Install the toolchain and targets
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          scripts/check-qualified-rust.sh

      - name: Validate the shipped pair version
        shell: bash
        run: |
          version=$(cargo metadata --locked --format-version 1 --no-deps \
            | python3 scripts/check-release-version.py \
                --ref-type "$GITHUB_REF_TYPE" --ref-name "$GITHUB_REF_NAME")
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      # v2.9.2, pinned by commit so a mutable tag can't change what a
      # release run does.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Prepare both pinned native architectures
        run: |
          brew install gnupg
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            prefix=$(bash scripts/build-openssl.sh --target "$target" --cache "$RUNNER_TEMP/native-crypto" --jobs 2)
            scoped=$(printf '%s' "$target" | tr '[:lower:]-' '[:upper:]_')
            echo "${scoped}_OPENSSL_DIR=$prefix" >> "$GITHUB_ENV"
            echo "${scoped}_OPENSSL_STATIC=1" >> "$GITHUB_ENV"
          done

      - name: Test daemon handover on macOS
        run: |
          test_home=$(mktemp -d)
          trap 'rm -rf "$test_home"' EXIT
          mkdir -p "$test_home/cache" "$test_home/config"
          CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" \
            HOME="$test_home" XDG_CACHE_HOME="$test_home/cache" \
            XDG_CONFIG_HOME="$test_home/config" HISTFILE=/dev/null \
            cargo test --locked -p qshd --lib handover::tests -- --test-threads=1

      - name: Build both architectures
        run: |
          cargo build --release --locked -p qsh -p qshd --target aarch64-apple-darwin
          cargo build --release --locked -p qsh -p qshd --target x86_64-apple-darwin

      # macOS strip has no GNU-style -o flag, so it strips the binary in place.
      - name: Strip
        run: |
          strip target/aarch64-apple-darwin/release/qsh
          strip target/aarch64-apple-darwin/release/qshd
          strip target/x86_64-apple-darwin/release/qsh
          strip target/x86_64-apple-darwin/release/qshd

      - name: Package
        run: |
          VERSION="$RELEASE_VERSION"
          mkdir -p dist
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            stage="qsh-$VERSION-$target"
            mkdir -p "$stage"
            cp "target/$target/release/qsh" "target/$target/release/qshd" "$stage/"
            cp README.md LICENSE CHANGELOG.md "$stage/"
            cp docs/licenses/openssl.txt "$stage/LICENSE-OPENSSL.txt"
            tar czf "dist/$stage.tar.gz" "$stage"
            # Probes both actual stripped inputs, then checks archived bytes.
            python3 scripts/check-release-output.py archive --version "$VERSION" \
              --target "$target" --inputs "$stage" "dist/$stage.tar.gz"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/

  # The system-mode `qshd`: dynamically linked against glibc and libpam, and
  # for that reason built nowhere above. The other jobs build personal-mode
  # daemons: musl-static on Linux and native Darwin binaries on macOS;
  # see packaging/build-server-packages.sh's own header for why the two
  # cannot be the same binary. This job runs that script for real,
  # unmodified: it builds its own containers (packaging/Dockerfile.build-deb,
  # packaging/Dockerfile.build-rpm -- Ubuntu 20.04 and Rocky Linux 8, the
  # glibc/libpam floors named in the design) and checks every package it
  # makes against the floor the container promises before this job ever
  # sees it. Nothing here re-implements or second-guesses that check.
  server-packages:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    # Two containers, four packages, each rebuilding qshd with --features
    # system inside its container: under six minutes end to end on a warm
    # Docker cache (measured locally). A GitHub runner starts with no cache
    # at all -- task 5's own build measured close to 25 minutes per
    # container format, almost entirely the base image pull and the
    # toolchain install, before any of that was cached -- so this leaves
    # real headroom for two cold formats rather than cutting it close. See
    # the `linux` job's timeout comment for why this is bounded at all.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Verify the exact source commit
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          echo "Source commit: $actual (run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT)"
          test "$actual" = "$GITHUB_SHA"

      - name: Install the metadata toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          scripts/check-qualified-rust.sh

      - name: Validate the shipped pair version
        id: version
        shell: bash
        run: |
          version=$(cargo metadata --locked --format-version 1 --no-deps \
            | python3 scripts/check-release-version.py \
                --ref-type "$GITHUB_REF_TYPE" --ref-name "$GITHUB_REF_NAME")
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Docker ships on GitHub's ubuntu-latest runners already; the script
      # drives it directly (build the image, then run itself inside it).
      - name: Build the server packages
        run: packaging/build-server-packages.sh all

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-packages
          path: dist/

  # Task 9b of the system-mode-slice3 plan: layer 3 of design §11, over the
  # INSTALLED package -- never the build tree `server-packages` just made.
  # That distinction is not ceremony: earlier in this same slice, a change
  # to where the daemon writes its log broke this whole tier outright (five
  # suites, zero passing), and three rounds of review missed it, because
  # nobody had run the real thing. See packaging/acceptance.sh's own header
  # for the rest: the security-regression test this exists for, the
  # network design (client and server both run inside the container), and
  # why systemd is checked as a file and never started as PID 1.
  #
  # A job of its own, not a step tacked onto `server-packages` above, and
  # that separation is load-bearing rather than tidy: this needs its own
  # Rust toolchain (for `acceptance_client`, which never ships -- see that
  # file's header) on the RUNNER, outside any container, which
  # `server-packages` has no reason to install. Splitting the two families
  # into a fail-fast: false matrix means a Debian-only or Fedora-only
  # regression is reported as exactly that, not folded into one job's
  # single pass/fail.
  server-packages-acceptance:
    needs: [server-packages]
    runs-on: ubuntu-latest
    # The deb and rpm runs together measured well under a minute on a warm
    # Docker cache locally; twenty minutes leaves real headroom for a cold
    # one on a fresh runner (see `server-packages`'s own timeout comment
    # for why every job here is bounded at all).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        glob: ['qshd_*_amd64.deb', 'qshd-*.x86_64.rpm']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Verify the exact source commit
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          echo "Source commit: $actual (run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT)"
          test "$actual" = "$GITHUB_SHA"

      - name: Install the toolchain and the musl target
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup target add x86_64-unknown-linux-musl
          scripts/check-qualified-rust.sh

      # v2.9.2, pinned by commit so a mutable tag can't change what a
      # release run does.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-packages
          path: dist

      - name: Install native acceptance-client prerequisites
        run: sudo apt-get update && sudo apt-get install -y musl-tools linux-libc-dev perl make gnupg

      - name: Run the acceptance tier
        env:
          EXPECTED_VERSION: ${{ needs.server-packages.outputs.version }}
        run: |
          test -n "$EXPECTED_VERSION"
          pkg=$(ls dist/${{ matrix.glob }})
          packaging/acceptance.sh "$pkg" "$EXPECTED_VERSION"

  # The cheap aarch64 tier design §11 asks for (its own words: "two
  # properties, both cheap"): the package installs under emulation, and the
  # installed daemon refuses to start without its PAM service file -- the
  # one property worth checking on both architectures, because it is the
  # cheapest possible proof that the binary actually executes here at all.
  # An aarch64 asset has shipped from this project once before without
  # ever having been installed on the architecture it targets; this is
  # what closes that gap on every release since.
  #
  # A SEPARATE job from `server-packages-acceptance` above, deliberately,
  # and not a second leg of the same matrix: pulling the SAME floor image
  # reference under two different platforms within one job's Docker cache
  # was measured, while writing this workflow, to fail outright ("cannot
  # overwrite digest") on a plain local Docker install -- a fresh job means
  # a fresh image cache, which never asks the same digest for two
  # platforms in the first place. Do not merge the two jobs back into one
  # matrix without re-checking that this still holds on GitHub's own
  # runners.
  server-packages-acceptance-aarch64:
    needs: [server-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        glob: ['qshd_*_arm64.deb', 'qshd-*.aarch64.rpm']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Verify the exact source commit
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          echo "Source commit: $actual (run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT)"
          test "$actual" = "$GITHUB_SHA"

      # v4.4.0, pinned by commit for the same reason Swatinem/rust-cache
      # above is: a mutable tag must not change what a release run does.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          platforms: arm64

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-packages
          path: dist

      # No Rust toolchain here: the cheap tier never builds or runs
      # acceptance_client, only `docker`/`dpkg`/`dnf`, which the runner
      # already has.
      - name: Run the acceptance tier
        env:
          EXPECTED_VERSION: ${{ needs.server-packages.outputs.version }}
        run: |
          test -n "$EXPECTED_VERSION"
          pkg=$(ls dist/${{ matrix.glob }})
          packaging/acceptance.sh "$pkg" "$EXPECTED_VERSION"

  release:
    needs:
      [
        native-crypto,
        linux,
        macos,
        server-packages,
        server-packages-acceptance,
        server-packages-acceptance-aarch64,
      ]
    runs-on: ubuntu-latest
    # Assembly and scanning also run for nonpublishing branch packages.
    permissions:
      contents: read
    # Just checksumming, scanning and artifact upload -- no build here.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Verify the exact source commit
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          echo "Source commit: $actual (run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT)"
          test "$actual" = "$GITHUB_SHA"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Collect and checksum
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Check release artifacts for secrets
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
          scanner="$RUNNER_TEMP/gitleaks"
          audit="$RUNNER_TEMP/release-audit"
          mkdir -p "$scanner" "$audit"
          curl --fail --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scanner/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$scanner/gitleaks.tar.gz" -C "$scanner"
          for package in dist/*.tar.gz dist/*.deb dist/*.rpm; do
            unpacked="$audit/$(basename "$package")"
            mkdir -p "$unpacked"
            bsdtar -xf "$package" -C "$unpacked"
            # Debian packages contain nested control and data archives.
            for nested in "$unpacked"/*.tar.*; do
              [ -f "$nested" ] || continue
              bsdtar -xf "$nested" -C "$unpacked"
            done
          done
          # Include printable binary contents and paths in the scan.
          find "$audit" -type f -print0 > "$RUNNER_TEMP/release-audit-files"
          while IFS= read -r -d '' file; do
            strings -a "$file" > "$file.strings"
          done < "$RUNNER_TEMP/release-audit-files"
          printf '[extend]\nuseDefault = true\n' > "$scanner/config.toml"
          "$scanner/gitleaks" dir "$audit" --config "$scanner/config.toml" \
            --redact=100 --ignore-gitleaks-allow --max-archive-depth=4

      # Every run -- tag or `workflow_dispatch` -- produces the twelve
      # files above (six from `linux`: two client tarballs, two client
      # .deb, two client .rpm; two client tarballs from `macos`; four
      # server packages -- .deb and .rpm, x86_64 and aarch64 -- from
      # `server-packages`) plus their checksums; make them downloadable
      # either way, not just print the checksums to the log.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # Default needs propagation blocks publication on failure or skipped CI.
  # Keep this separate so branch assembly does not depend on skipped tag CI.
  publish:
    if: github.ref_type == 'tag'
    needs: [release, ordinary-ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Verify the exact source commit
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          echo "Source commit: $actual (run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT)"
          test "$actual" = "$GITHUB_SHA"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # The changelog section for this version, taken verbatim. The heading
      # separates version from date with an em dash, so the end of the
      # section is found by the next "## " line rather than by that character.
      - name: Extract the release notes
        if: github.ref_type == 'tag'
        run: |
          python3 - "$GITHUB_REF_NAME" <<'EOF' > notes.md
          import io, sys
          version = sys.argv[1].lstrip("v")
          lines = io.open("CHANGELOG.md", encoding="utf-8").read().splitlines()
          out, inside = [], False
          for line in lines:
              if line.startswith("## "):
                  if inside:
                      break
                  inside = f"[{version}]" in line
                  continue
              if inside:
                  out.append(line)
          text = "\n".join(out).strip()
          print(text if text else f"qsh {version}")
          EOF
          cat notes.md

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          # SemVer: a hyphen introduces a pre-release identifier
          # (v1.0.0-rc1), which the `v*.*.*` trigger above also matches.
          prerelease_flag=()
          case "$tag" in
            *-*) prerelease_flag=(--prerelease) ;;
          esac
          if gh release view "$tag" >/dev/null 2>&1; then
            # A retry after a previous run failed partway through: the
            # release already exists, so top up its assets instead of
            # erroring out on a duplicate `create`.
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "qsh ${tag#v}" --notes-file notes.md \
              "${prerelease_flag[@]}"
          fi
