name: Release source qualification diagnostic
run-name: Source qualification diagnostic ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ordinary-ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  package-success-control:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo 'Independent success control; this is not package qualification.'

  publication-witness:
    needs: [ordinary-ci, package-success-control]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo 'Read-only witness reached after complete ordinary qualification.'
