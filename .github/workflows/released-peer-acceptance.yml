name: Released-peer acceptance

on:
  # Qualify changes to this gate before merge without repeating it on every patch.
  pull_request:
    paths:
      - '.github/workflows/released-peer-acceptance.yml'
      - '.github/workflows/release.yml'
      - 'scripts/released-peer-acceptance.py'
      - 'scripts/tests/test_released_peer_acceptance.py'
      - 'cli/tests/mixed_versions.rs'
      - 'qshd/tests/mixed_versions.rs'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUSTUP_TOOLCHAIN: "1.99.1"
  CARGO_BUILD_JOBS: "2"
  HISTFILE: /dev/null

jobs:
  released-peers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the exact candidate source
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          echo "Candidate source: $actual (run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT)"
          test "$actual" = "$GITHUB_SHA"
      - name: Install the qualified toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          scripts/check-qualified-rust.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install focused fixture prerequisites
        run: sudo apt-get update && sudo apt-get install -y perl make gcc gnupg tmux
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/native-crypto
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/*openssl*', 'scripts/openssl/*') }}
      - name: Prepare the pinned native backend
        shell: bash
        run: |
          target=$(rustc -vV | sed -n 's/^host: //p')
          prefix=$(bash scripts/build-openssl.sh --target "$target" --cache "$RUNNER_TEMP/native-crypto" --jobs 2)
          echo "OPENSSL_DIR=$prefix" >> "$GITHUB_ENV"
          echo 'OPENSSL_STATIC=1' >> "$GITHUB_ENV"
      - name: Qualify the acceptance controls
        run: python3 -m unittest discover -s scripts/tests -p 'test_released_peer_acceptance.py'
      - name: Run six exact released-peer and current-peer scenarios
        run: python3 scripts/released-peer-acceptance.py --evidence "$RUNNER_TEMP/released-peer-evidence"
      - name: Retain source, fixture and exact test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: released-peer-evidence
          path: ${{ runner.temp }}/released-peer-evidence/
          if-no-files-found: error
