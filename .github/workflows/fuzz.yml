name: Fuzz smoke

# CI selects this smoke when a change reaches the fuzz crate's closure and
# calls it (#609); Release and Nightly call it for every candidate.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# No concurrency group: a called run would share it with its caller and
# cancel that run. The caller's own group governs a called smoke.

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "nightly-2026-10-24"

jobs:
  fuzz-smoke:
    name: Build and smoke the parser fuzz targets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Verify the exact source commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install the pinned toolchain
        run: rustup toolchain install nightly-2026-10-24 --profile minimal --no-self-update

      - name: Install the verified cargo-fuzz source
        run: |
          set -euo pipefail
          crate="$RUNNER_TEMP/cargo-fuzz-0.13.2.crate"
          source="$RUNNER_TEMP/cargo-fuzz-source"
          mkdir -p "$source"
          curl --fail --location --silent --show-error \
            https://static.crates.io/crates/cargo-fuzz/cargo-fuzz-0.13.2.crate \
            -o "$crate"
          echo "5acfd01930e49823e58c30dd8012d3338a620377d7c7d4cc140ca4b2169400e2  $crate" \
            | sha256sum --check -
          tar -xzf "$crate" -C "$source"
          cp fuzz/tools/cargo-fuzz-0.13.2.Cargo.lock \
            "$source/cargo-fuzz-0.13.2/Cargo.lock"
          cargo install --path "$source/cargo-fuzz-0.13.2" --locked \
            --root "$RUNNER_TEMP/fuzz-tools"
          echo "$RUNNER_TEMP/fuzz-tools/bin" >> "$GITHUB_PATH"

      - name: Verify every corpus inventory
        run: |
          set -euo pipefail
          for target in channel_codec handshake_payload wire_datagram deframer \
            authorized_keys terminal_feed_resize; do
            python3 fuzz/tools/check_corpus.py \
              "fuzz/corpus/$target/manifest.json" "fuzz/corpus/$target"
          done
          PYTHONDONTWRITEBYTECODE=1 \
            python3 -m unittest discover -s fuzz/tools -p 'test_check_corpus.py'
          PYTHONDONTWRITEBYTECODE=1 \
            python3 -m unittest discover -s fuzz/tools -p 'test_run_smoke.py'

      - name: Verify locked product and fuzz dependency sources
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 \
            python3 -m unittest discover -s fuzz/tools -p 'test_check_dependencies.py'
          # Fetch with the committed locks before enforcing an offline build.
          cargo fetch --locked --manifest-path Cargo.toml
          cargo fetch --locked --manifest-path fuzz/Cargo.toml
          python3 fuzz/tools/check_dependencies.py --offline
          sha256sum Cargo.lock fuzz/Cargo.lock > "$RUNNER_TEMP/fuzz-locks.sha256"

      - name: Build all ASAN targets
        run: |
          set -euo pipefail
          CARGO_NET_OFFLINE=true cargo fuzz build --target x86_64-unknown-linux-gnu \
            --target-dir "$RUNNER_TEMP/fuzz-target"
          sha256sum --check "$RUNNER_TEMP/fuzz-locks.sha256"

      - name: Run the ordinary harness and oracle tests
        run: |
          set -euo pipefail
          CARGO_NET_OFFLINE=true cargo test --manifest-path fuzz/Cargo.toml \
            --locked --lib --target-dir "$RUNNER_TEMP/fuzz-test-target"
          sha256sum --check "$RUNNER_TEMP/fuzz-locks.sha256"

      - name: Run a bounded mutation smoke per target
        run: |
          set -euo pipefail
          # Every target runs; each failure reason and a bounded log tail are
          # printed before this step fails.
          python3 fuzz/tools/run_smoke.py \
            --binaries "$RUNNER_TEMP/fuzz-target/x86_64-unknown-linux-gnu/release" \
            --seeds-root fuzz/corpus --work "$RUNNER_TEMP/fuzz-smoke" \
            --runs 1000 --max-total-time 10 --wall-timeout 120 \
            channel_codec=65537 handshake_payload=512 wire_datagram=2048 \
            deframer=4096 authorized_keys=8192 terminal_feed_resize=8196

      # Only the bounded run logs and libFuzzer's failing inputs, never the
      # mutated corpora, the toolchain or the workspace.
      - name: Retain failing smoke logs and inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-smoke-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fuzz-smoke/*/run.log
            ${{ runner.temp }}/fuzz-smoke/*/artifacts/
          if-no-files-found: ignore
          retention-days: 7
