name: Native crypto prerequisite

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'qshd/**'
      - 'crates/logging/**'
      - 'crates/transport/**'
      - 'crates/terminal-size/**'
      - 'crates/terminal/**'
      - 'vendor/vte/**'
      - 'vendor/alacritty_terminal/**'
      - '.github/workflows/ci.yml'
      - 'packaging/build-server-packages.sh'
      - 'packaging/acceptance.sh'
      - 'scripts/check-pam-linkage.sh'
      - 'crates/sshauth/**'
      - 'crates/ssh/src/crypto_worker.rs'
      - 'scripts/*openssl*'
      - 'scripts/openssl/**'
      - 'scripts/tests/test_build_openssl.py'
      - '.github/workflows/native-crypto.yml'
      - '.github/workflows/release.yml'
      - 'packaging/Dockerfile.build-*'
      - 'packaging/bootstrap/**'
      - 'packaging/rpm-tool/**'
      - 'scripts/tests/test_rpm_tool.py'
      - 'scripts/tests/test_bootstrap_tools.py'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'qshd/**'
      - 'crates/logging/**'
      - 'crates/transport/**'
      - 'crates/terminal-size/**'
      - 'crates/terminal/**'
      - 'vendor/vte/**'
      - 'vendor/alacritty_terminal/**'
      - '.github/workflows/ci.yml'
      - 'packaging/build-server-packages.sh'
      - 'packaging/acceptance.sh'
      - 'scripts/check-pam-linkage.sh'
      - 'crates/sshauth/**'
      - 'crates/ssh/src/crypto_worker.rs'
      - 'scripts/*openssl*'
      - 'scripts/openssl/**'
      - 'scripts/tests/test_build_openssl.py'
      - '.github/workflows/native-crypto.yml'
      - '.github/workflows/release.yml'
      - 'packaging/Dockerfile.build-*'
      - 'packaging/bootstrap/**'
      - 'packaging/rpm-tool/**'
      - 'scripts/tests/test_rpm_tool.py'
      - 'scripts/tests/test_bootstrap_tools.py'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: '2'
  HISTFILE: /dev/null
  RUSTUP_TOOLCHAIN: '1.99.1'

jobs:
  portable:
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Observe the Intel Darwin runtime
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        timeout-minutes: 2
        run: |
          python3 -I -B - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path
          import re
          import sys

          QUERIES = (
              ('checkout', ('/usr/bin/git', 'rev-parse', 'HEAD')),
              ('kernel_version', ('/usr/sbin/sysctl', '-n', 'kern.version')),
              ('osrelease', ('/usr/sbin/sysctl', '-n', 'kern.osrelease')),
              ('os_build', ('/usr/sbin/sysctl', '-n', 'kern.osversion')),
              ('hw_machine', ('/usr/sbin/sysctl', '-n', 'hw.machine')),
              ('uname_machine', ('/usr/bin/uname', '-m')),
              ('os_version', ('/usr/bin/sw_vers', '-productVersion')),
          )
          class Refused(Exception):
              def __init__(self, query):
                  self.query = query if query in {name for name, _ in QUERIES} else 'checkout'

          def token(value, pattern, limit, query):
              if type(value) is not str or len(value) > limit or re.fullmatch(pattern, value) is None:
                  raise Refused(query)
              return value

          def kernel(value):
              day = r'(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)'
              month = r'(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)'
              date = day + ' ' + month + r' {1,2}(?:[1-9]|[12][0-9]|3[01]) (?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9] (?:[A-Z]{1,8}|[+-][0-9]{4}) [0-9]{4}'
              version = r'[0-9]{1,5}(?:\.[0-9]{1,5}){1,2}'
              revision = r'[0-9]{1,12}(?:[.~][0-9]{1,12}){0,12}'
              return token(value, 'Darwin Kernel Version ' + version + ': ' + date + '; root:xnu-' + revision + r'/RELEASE_[A-Z0-9_]{1,96}', 512, 'kernel_version')

          def build_record(values, environ):
              if type(values) is not dict or set(values) != {name for name, _ in QUERIES}:
                  raise Refused('checkout')
              sha = token(values['checkout'], r'[0-9a-f]{40}', 40, 'checkout')
              event = token(environ.get('GITHUB_SHA'), r'[0-9a-f]{40}', 40, 'checkout')
              run = token(environ.get('GITHUB_RUN_ID'), r'[1-9][0-9]{0,19}', 20, 'checkout')
              attempt = token(environ.get('GITHUB_RUN_ATTEMPT'), r'[1-9][0-9]{0,9}', 10, 'checkout')
              for name in ('hw_machine', 'uname_machine'):
                  token(values[name], r'x86_64', 32, name)
              return dict(schema=1, kind='darwin-intel-preflight', checkout_sha=sha, event_sha=event,
                          run_id=int(run), attempt=int(attempt), runner_label='macos-15-intel',
                          target='x86_64-apple-darwin', kernel_version=kernel(values['kernel_version']),
                          osrelease=token(values['osrelease'], r'[0-9]+(?:\.[0-9]+)*', 32, 'osrelease'),
                          os_build=token(values['os_build'], r'[A-Za-z0-9]+', 32, 'os_build'),
                          os_version=token(values['os_version'], r'[0-9]+(?:\.[0-9]+)*', 20, 'os_version'),
                          hw_machine=values['hw_machine'], uname_machine=values['uname_machine'])

          def collect(metadata_command, environ):
              values = {}
              for name, argv in QUERIES:
                  try:
                      raw = metadata_command(list(argv), timeout=10, category='static-tool')
                      if type(raw) is not bytes or not 0 < len(raw) <= 65536 or raw.count(b'\n') != 1 or not raw.endswith(b'\n'):
                          raise Refused(name)
                      values[name] = raw[:-1].decode('ascii')
                  except Exception:
                      raise Refused(name) from None
              return build_record(values, environ)

          def main():
              try:
                  path = Path('scripts/check-release-output.py')
                  spec = importlib.util.spec_from_file_location('_qsh_release_output', path)
                  module = importlib.util.module_from_spec(spec)
                  spec.loader.exec_module(module)
                  record = collect(module.metadata_command, os.environ)
                  line = ('DARWIN_INTEL_PREFLIGHT ' + json.dumps(record, sort_keys=True, separators=(',', ':'), ensure_ascii=True) + '\n').encode('ascii')
                  if len(line) > 2048:
                      raise Refused('kernel_version')
                  sys.stdout.buffer.write(line)
                  return 0
              except Exception as error:
                  query = error.query if isinstance(error, Refused) else 'checkout'
                  print('INTEL_PREFLIGHT_REFUSED query=' + query, file=sys.stderr)
                  return 1

          if __name__ == '__main__':
              raise SystemExit(main())
          PY
      - name: Install native prerequisites
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y musl-tools linux-libc-dev perl make gnupg
          else
            brew install gnupg
          fi
      - name: Build and execute the pinned backend
        shell: bash
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          args=()
          if [ "$RUNNER_OS" = Linux ]; then
            # Only kernel UAPI headers supplement musl's own include path;
            # adding /usr/include wholesale would mix glibc and musl headers.
            uapi="$RUNNER_TEMP/kernel-uapi"
            mkdir -p "$uapi"
            ln -s /usr/include/linux "$uapi/linux"
            ln -s /usr/include/asm-generic "$uapi/asm-generic"
            ln -s "/usr/include/$(gcc -dumpmachine)/asm" "$uapi/asm"
            args+=(--cflag=-idirafter --cflag="$uapi")
          fi
          bash scripts/qualify-openssl.sh --target "$NATIVE_TARGET" \
            --cache "$RUNNER_TEMP/native-crypto" \
            --toolchain-id "$ImageOS/$ImageVersion" "${args[@]}"
          prefix=$(bash scripts/build-openssl.sh --target "$NATIVE_TARGET" \
            --cache "$RUNNER_TEMP/native-crypto" \
            --toolchain-id "$ImageOS/$ImageVersion" "${args[@]}")
          echo "OPENSSL_DIR=$prefix" >> "$GITHUB_ENV"
          echo 'OPENSSL_STATIC=1' >> "$GITHUB_ENV"
      - name: Install qualified Rust for linked product checks
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup target add '${{ matrix.target }}'
          scripts/check-qualified-rust.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: native-products-${{ matrix.target }}
      - name: Qualify the linked products and generated RSA operations
        shell: bash
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then export CC=musl-gcc; fi
          cargo build --locked -p qsh -p qshd --target "$NATIVE_TARGET"
          cargo test --locked -p sshauth --target "$NATIVE_TARGET" \
            --test rsa_file_signing --test native_rsa_backend -- --include-ignored
          if [ "$RUNNER_OS" = Linux ]; then
            dynamic=$(readelf -d "target/$NATIVE_TARGET/debug/qsh" "target/$NATIVE_TARGET/debug/qshd")
            if grep -q NEEDED <<< "$dynamic"; then
              echo 'musl products import dynamic libraries' >&2
              exit 1
            fi
          else
            dynamic=$(otool -L "target/$NATIVE_TARGET/debug/qsh" "target/$NATIVE_TARGET/debug/qshd")
            if grep -Ei 'lib(ssl|crypto).*dylib' <<< "$dynamic"; then
              echo 'products import an unqualified dynamic native backend' >&2
              exit 1
            fi
          fi

      - name: Qualify the production Intel Darwin process owner
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          runtime=$(mktemp -d "$RUNNER_TEMP/qsh-darwin-owner.XXXXXX")
          trap 'rm -rf "$runtime"' EXIT
          mkdir -m 700 "$runtime/home" "$runtime/config" "$runtime/cache" "$runtime/tmp"
          export HOME="$runtime/home" XDG_CONFIG_HOME="$runtime/config" XDG_CACHE_HOME="$runtime/cache"
          export TMPDIR="$runtime/tmp" HISTFILE=/dev/null
          cargo build -p qshd --bin qshd --features test-build-labels --locked --message-format=json-render-diagnostics > "$runtime/build.jsonl"
          python3 - "$runtime/build.jsonl" "$runtime/daemon-path" <<'PY_DAEMON'
          import json, pathlib, sys
          records = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
          paths = [record["executable"] for record in records if record.get("reason") == "compiler-artifact" and record.get("target", {}).get("name") == "qshd" and record.get("target", {}).get("kind") == ["bin"] and record.get("executable")]
          assert len(paths) == 1 and pathlib.Path(paths[0]).is_file()
          pathlib.Path(sys.argv[2]).write_text(paths[0])
          PY_DAEMON
          export QSH_DARWIN223_DAEMON="$(cat "$runtime/daemon-path")"
          export QSH_DARWIN223_DAEMON_SHA256="$(shasum -a 256 "$QSH_DARWIN223_DAEMON" | awk '{print $1}')"
          cargo test -p qshd --lib --features test-build-labels --locked darwin_process_scope::native_tests::darwin223_native_ \
            -- --nocapture --test-threads=1 2>&1 | tee "$runtime/results.log"
          for name in \
            darwin_process_scope::native_tests::darwin223_native_noncooperative_token_exec_and_bound_exit \
            darwin_process_scope::native_tests::darwin223_native_signaled_leader_scope_uses_portable_code_one \
            darwin_process_scope::native_tests::darwin223_native_already_zombie_handshake_child_keeps_reserved_leader \
            darwin_process_scope::native_tests::darwin223_native_classification_bracket_refuses_exec_and_one_sided_zombie \
            darwin_process_scope::native_tests::darwin223_native_silent_pty_leader_first_other_group_and_real_io_joins \
            darwin_process_scope::native_tests::darwin223_native_connected_close_stop_rebind_and_fresh_session \
            darwin_process_scope::native_tests::darwin223_native_exit_before_binding_exclusion_zombie_and_last_fork \
            darwin_process_scope::native_tests::darwin223_native_term_and_interrupt_join_real_manager_and_workers \
            darwin_process_scope::native_tests::darwin223_native_partial_descriptor_failure_retains_real_process_owner \
            darwin_process_scope::native_tests::darwin223_native_actual_daemon_replacement_reaps_parked_scope_and_fresh_session
          do
            awk -v expected="test $name ... " '
              index($0, expected) == 1 {
                seen++; pending = 1
                if ($0 == expected "ok") { passed++; pending = 0 }
                next
              }
              pending && $0 == "ok" { passed++; pending = 0 }
              END { exit !(seen == 1 && passed == 1) }
            ' "$runtime/results.log"
          done
          ! grep -F 'SKIPPED' "$runtime/results.log"
          grep -F 'test result: ok. 10 passed; 0 failed; 0 ignored;' "$runtime/results.log"
          cargo test -p qshd --lib --features test-build-labels --locked darwin_process_scope::keeper_tests::keeper_native_ \
            -- --nocapture --test-threads=1 2>&1 | tee "$runtime/keeper-results.log"
          for name in \
            darwin_process_scope::keeper_tests::keeper_native_exit37_and_pty_eof \
            darwin_process_scope::keeper_tests::keeper_native_session_death_late_fork \
            darwin_process_scope::keeper_tests::keeper_native_broker_group_intrusion \
            darwin_process_scope::keeper_tests::keeper_native_cancel_before_admit_no_application
          do
            awk -v expected="test $name ... " '
              index($0, expected) == 1 {
                seen++; pending = 1
                if ($0 == expected "ok") { passed++; pending = 0 }
                next
              }
              pending && $0 == "ok" { passed++; pending = 0 }
              END { exit !(seen == 1 && passed == 1) }
            ' "$runtime/keeper-results.log"
          done
          if grep -F 'SKIPPED' "$runtime/keeper-results.log"; then exit 1; fi
          grep -F 'test result: ok. 4 passed; 0 failed; 0 ignored;' "$runtime/keeper-results.log"
          if grep -F 'rescue=true' "$runtime/keeper-results.log"; then exit 1; fi
          test "$(grep -Fc 'case=cancel after_admit=false expired=false noapp=true app=None' "$runtime/keeper-results.log")" -eq 1
          test "$(grep -Fc 'case=cancel after_admit=true expired=false noapp=false app=Some(' "$runtime/keeper-results.log")" -eq 1
          test "$(grep -Fc 'case=cancel after_admit=false expired=true noapp=true app=None' "$runtime/keeper-results.log")" -eq 1
          rustup component add clippy --toolchain "$RUSTUP_TOOLCHAIN"
          scripts/check-qualified-rust.sh
          rustc -vV
          cargo check -p qshd --all-targets --features test-darwin-keeper --locked
          cargo clippy -p qshd --all-targets --features test-darwin-keeper --locked -- -D warnings
          cargo build -p qshd --bin qshd --features test-darwin-keeper --locked --message-format=json-render-diagnostics > "$runtime/keeper-integrated-build.jsonl"
          python3 - "$runtime/keeper-integrated-build.jsonl" "$runtime/keeper-integrated-daemon-path" <<'PY_KEEPER'
          import json, pathlib, sys
          records = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
          records = [r for r in records if r.get("reason") == "compiler-artifact" and r.get("target", {}).get("name") == "qshd" and r.get("target", {}).get("kind") == ["bin"] and r.get("executable")]
          assert len(records) == 1 and {"test-darwin-keeper", "test-build-labels"}.issubset(records[0]["features"])
          assert pathlib.Path(records[0]["executable"]).is_file()
          pathlib.Path(sys.argv[2]).write_text(records[0]["executable"])
          PY_KEEPER
          export QSH_DARWIN223_DAEMON="$(cat "$runtime/keeper-integrated-daemon-path")"
          export QSH_DARWIN223_DAEMON_SHA256="$(shasum -a 256 "$QSH_DARWIN223_DAEMON" | awk '{print $1}')"
          printf 'keeper223 compatibility_Cargo_binary_sha256=%s source=compiled-missing\n' "$QSH_DARWIN223_DAEMON_SHA256"
          cargo test -p qshd --lib --features test-darwin-keeper --locked darwin_process_scope::keeper_integration_tests::keeper_integrated_ \
            -- --nocapture --test-threads=1 2>&1 | tee "$runtime/keeper-integrated-results.log"
          for name in \
            darwin_process_scope::keeper_integration_tests::keeper_integrated_terminal_status_and_io \
            darwin_process_scope::keeper_integration_tests::keeper_integrated_open_cancel_and_setup_failure \
            darwin_process_scope::keeper_integration_tests::keeper_integrated_close_stop_rebind_and_fresh_session \
            darwin_process_scope::keeper_integration_tests::keeper_integrated_term_interrupt_join \
            darwin_process_scope::keeper_integration_tests::keeper_integrated_actual_daemon_replacement \
            darwin_process_scope::keeper_integration_tests::keeper_integrated_foreign_sid_retains_debt
          do
            awk -v expected="test $name ... " '
              index($0, expected) == 1 {
                seen++; pending = 1
                if ($0 == expected "ok") { passed++; pending = 0 }
                next
              }
              pending && $0 == "ok" { passed++; pending = 0 }
              END { exit !(seen == 1 && passed == 1) }
            ' "$runtime/keeper-integrated-results.log"
          done
          if grep -F 'SKIPPED' "$runtime/keeper-integrated-results.log"; then exit 1; fi
          if grep -F 'rescue=true' "$runtime/keeper-integrated-results.log"; then exit 1; fi
          grep -F 'test result: ok. 6 passed; 0 failed; 0 ignored;' "$runtime/keeper-integrated-results.log"
          grep -F 'keeper223 route=keeper source=compiled-missing' "$runtime/keeper-integrated-results.log"
          test "$(grep -Fc 'real_eof_delivered_alive=true' "$runtime/keeper-integrated-results.log")" -eq 4
          test "$(grep -Fc 'keeper223 open_executor mode=' "$runtime/keeper-integrated-results.log")" -eq 4
          grep -F 'ledger_before_setsid=true pending_interval=true refund=false replacement_refused=true foreign_signal=false voluntary_exit=true rescue=false' "$runtime/keeper-integrated-results.log"
          grep -F 'wire_STOP=ack_then_actual_exit_watch_and_consumed_wait' "$runtime/keeper-integrated-results.log"
          grep -F 'keeper223 replacement_routes old_image=' "$runtime/keeper-integrated-results.log"

  system-floors:
    name: Native system floor (${{ matrix.format }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        format: [deb, rpm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install explicit ARM emulator
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Build existing package-floor image
        env:
          FORMAT: ${{ matrix.format }}
        run: docker build -f "packaging/Dockerfile.build-$FORMAT" -t qsh-native-floor packaging
      - name: Reject untrusted RPMs and prohibit foreign scriptlets
        if: matrix.format == 'rpm'
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,exec,nosuid --tmpfs /var/tmp:rw,exec,nosuid \
            --tmpfs /var/log:rw,noexec,nosuid --tmpfs /run:rw,noexec,nosuid \
            -e HISTFILE=/dev/null -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD/packaging/bootstrap:/bootstrap:ro" \
            qsh-native-floor /usr/libexec/platform-python /bootstrap/test-sysroot.py
      - name: Qualify both GNU architectures inside the actual floor
        env:
          FORMAT: ${{ matrix.format }}
        run: |
          mkdir -p "$RUNNER_TEMP/native-floor"
          docker run --rm --user "$(id -u):$(id -g)" \
            -e CARGO_BUILD_JOBS=2 -e HISTFILE=/dev/null -e FORMAT \
            -v "$PWD:/work:ro" -v "$RUNNER_TEMP/native-floor:/native" \
            -v /usr/bin/qemu-aarch64-static:/usr/local/bin/qemu-aarch64-static:ro \
            qsh-native-floor bash -euc '
              export HOME=/native/home CARGO_HOME=/native/cargo CARGO_TARGET_DIR=/native/products
              mkdir -p "$HOME" "$CARGO_HOME" /native/source
              cp -a /work/. /native/source/
              cd /native/source
              bash scripts/qualify-openssl.sh --target x86_64-unknown-linux-gnu \
                --cache /native/products/native-crypto --toolchain-id "package-floor-$FORMAT"
              if [ "$FORMAT" = deb ]; then
                sysroot=/usr/aarch64-linux-gnu
              else
                sysroot=/usr/aarch64-linux-gnu/sys-root
              fi
              bash scripts/qualify-openssl.sh --target aarch64-unknown-linux-gnu \
                --cache /native/products/native-crypto --cc aarch64-linux-gnu-gcc \
                --ar aarch64-linux-gnu-ar --ranlib aarch64-linux-gnu-ranlib \
                --toolchain-id "package-floor-$FORMAT" \
                --runner /usr/local/bin/qemu-aarch64-static \
                --runner-arg=-L --runner-arg="$sysroot"
              # Use the existing package build and its exact glibc/PAM checks
              # to qualify linked system products, not only the native C probe.
              packaging/build-server-packages.sh --in-container "$FORMAT"
              for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
                binary="$CARGO_TARGET_DIR/$target/release/qshd"
                dynamic=$(readelf -d "$binary")
                if grep -E "NEEDED.*lib(ssl|crypto)\.so" <<< "$dynamic"; then
                  echo "system product imports an unqualified native backend" >&2
                  exit 1
                fi
              done
            '
