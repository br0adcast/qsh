name: Native crypto prerequisite
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'pty-eof-build' && format('PTY EOF build · {0} · {1}', github.ref_name, github.sha) || github.event_name == 'workflow_dispatch' && inputs.mode == 'pty-eof-control' && format('PTY EOF control · {0} · {1}', github.ref_name, github.sha) || '' }}

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'qshd/**'
      - 'crates/logging/**'
      - 'crates/transport/**'
      - 'crates/terminal-size/**'
      - 'crates/terminal/**'
      - 'vendor/vte/**'
      - 'vendor/alacritty_terminal/**'
      - '.github/workflows/ci.yml'
      - 'cli/Cargo.toml'
      - 'cli/tests/mixed_versions.rs'
      - 'crates/daemon-bootstrap-protocol/**'
      - 'scripts/released-peer-acceptance.py'
      - 'scripts/tests/test_released_peer_acceptance.py'
      - 'packaging/build-server-packages.sh'
      - 'packaging/acceptance.sh'
      - 'scripts/check-pam-linkage.sh'
      - 'crates/sshauth/**'
      - 'crates/release-auth/**'
      - 'crates/ssh/src/crypto_worker.rs'
      - 'scripts/*openssl*'
      - 'scripts/openssl/**'
      - 'scripts/tests/test_build_openssl.py'
      - 'scripts/check-native-verifier-paths.py'
      - 'scripts/tests/test_native_verifier_paths.py'
      - '.github/workflows/native-crypto.yml'
      - '.github/workflows/release.yml'
      - 'packaging/Dockerfile.build-*'
      - 'packaging/bootstrap/**'
      - 'packaging/rpm-tool/**'
      - 'scripts/tests/test_rpm_tool.py'
      - 'scripts/tests/test_bootstrap_tools.py'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'qshd/**'
      - 'crates/logging/**'
      - 'crates/transport/**'
      - 'crates/terminal-size/**'
      - 'crates/terminal/**'
      - 'vendor/vte/**'
      - 'vendor/alacritty_terminal/**'
      - '.github/workflows/ci.yml'
      - 'cli/Cargo.toml'
      - 'cli/tests/mixed_versions.rs'
      - 'crates/daemon-bootstrap-protocol/**'
      - 'scripts/released-peer-acceptance.py'
      - 'scripts/tests/test_released_peer_acceptance.py'
      - 'packaging/build-server-packages.sh'
      - 'packaging/acceptance.sh'
      - 'scripts/check-pam-linkage.sh'
      - 'crates/sshauth/**'
      - 'crates/release-auth/**'
      - 'crates/ssh/src/crypto_worker.rs'
      - 'scripts/*openssl*'
      - 'scripts/openssl/**'
      - 'scripts/tests/test_build_openssl.py'
      - 'scripts/check-native-verifier-paths.py'
      - 'scripts/tests/test_native_verifier_paths.py'
      - '.github/workflows/native-crypto.yml'
      - '.github/workflows/release.yml'
      - 'packaging/Dockerfile.build-*'
      - 'packaging/bootstrap/**'
      - 'packaging/rpm-tool/**'
      - 'scripts/tests/test_rpm_tool.py'
      - 'scripts/tests/test_bootstrap_tools.py'
  workflow_dispatch:
    inputs:
      mode:
        description: Fixed qualification or standalone PTY EOF diagnostic stage
        type: choice
        required: true
        default: qualification
        options: [qualification, pty-eof-build, pty-eof-control]
  workflow_call:
    inputs:
      mode:
        type: string
        required: false
        default: qualification

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: '2'
  HISTFILE: /dev/null
  RUSTUP_TOOLCHAIN: '1.99.1'

jobs:
  portable:
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.mode == 'pty-eof-build' || inputs.mode == 'pty-eof-control')) }}
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native prerequisites
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y musl-tools linux-libc-dev perl make gnupg
          else
            brew install gnupg
          fi
      - name: Build and execute the pinned backend
        shell: bash
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          args=()
          if [ "$RUNNER_OS" = Linux ]; then
            # Only kernel UAPI headers supplement musl's own include path;
            # adding /usr/include wholesale would mix glibc and musl headers.
            uapi="$RUNNER_TEMP/kernel-uapi"
            mkdir -p "$uapi"
            ln -s /usr/include/linux "$uapi/linux"
            ln -s /usr/include/asm-generic "$uapi/asm-generic"
            ln -s "/usr/include/$(gcc -dumpmachine)/asm" "$uapi/asm"
            args+=(--cflag=-idirafter --cflag="$uapi")
          fi
          bash scripts/qualify-openssl.sh --target "$NATIVE_TARGET" \
            --cache "$RUNNER_TEMP/native-crypto" \
            --toolchain-id "$ImageOS/$ImageVersion" "${args[@]}"
          prefix=$(bash scripts/build-openssl.sh --target "$NATIVE_TARGET" \
            --cache "$RUNNER_TEMP/native-crypto" \
            --toolchain-id "$ImageOS/$ImageVersion" "${args[@]}")
          echo "OPENSSL_DIR=$prefix" >> "$GITHUB_ENV"
          echo 'OPENSSL_STATIC=1' >> "$GITHUB_ENV"
      - name: Install qualified Rust for linked product checks
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup target add '${{ matrix.target }}'
          scripts/check-qualified-rust.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: native-products-${{ matrix.target }}
      - name: Qualify offline release authentication
        shell: bash
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          python3 -I -B -m unittest discover -s scripts/tests -p test_native_verifier_paths.py
          if [ "$RUNNER_OS" = Linux ]; then export CC=musl-gcc; fi
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/qsh --remap-path-prefix=$cargo_home=/cargo --remap-path-prefix=$RUNNER_TEMP=/build"
          # Darwin's linker records object paths separately from compiler source paths.
          if [ "$RUNNER_OS" = macOS ]; then
            export RUSTFLAGS="$RUSTFLAGS -C link-arg=-Wl,-oso_prefix,$GITHUB_WORKSPACE/"
          fi
          if [ "$NATIVE_TARGET" = x86_64-apple-darwin ]; then
            test -z "${CARGO_ENCODED_RUSTFLAGS:-}"
            export RUSTFLAGS="$RUSTFLAGS -Dwarnings"
          fi
          export AWS_LC_SYS_USE_SYSTEM=0
          export AWS_LC_SYS_CFLAGS="-ffile-prefix-map=$GITHUB_WORKSPACE=/qsh -ffile-prefix-map=$cargo_home=/cargo -ffile-prefix-map=$RUNNER_TEMP=/build"
          cargo test --locked -p release-auth --all-targets --target "$NATIVE_TARGET"
          cargo build --locked -p release-auth --example verify-release --target "$NATIVE_TARGET"
          verifier="target/$NATIVE_TARGET/debug/examples/verify-release"
          if [ "$RUNNER_OS" = Linux ]; then
            dynamic=$(readelf -d "$verifier")
            if grep -q NEEDED <<< "$dynamic"; then
              echo 'musl release verifier imports dynamic libraries' >&2
              exit 1
            fi
          else
            dynamic=$(otool -L "$verifier")
            if grep -Ei 'lib(ssl|crypto).*dylib' <<< "$dynamic"; then
              echo 'release verifier imports a dynamic crypto backend' >&2
              exit 1
            fi
          fi
          python3 -I -B scripts/check-native-verifier-paths.py \
            "$verifier" "$GITHUB_WORKSPACE" "$cargo_home" "$RUNNER_TEMP"
      - name: Qualify the linked products and generated RSA operations
        shell: bash
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/qsh --remap-path-prefix=$cargo_home=/cargo --remap-path-prefix=$RUNNER_TEMP=/build"
          if [ "$RUNNER_OS" = macOS ]; then
            export RUSTFLAGS="$RUSTFLAGS -C link-arg=-Wl,-oso_prefix,$GITHUB_WORKSPACE/"
          fi
          rsa_baseline_rustflags="$RUSTFLAGS"
          if [ "$NATIVE_TARGET" = x86_64-apple-darwin ]; then
            test -z "${CARGO_ENCODED_RUSTFLAGS:-}"
            export RUSTFLAGS="$RUSTFLAGS -Dwarnings"
          fi
          export AWS_LC_SYS_USE_SYSTEM=0
          export AWS_LC_SYS_CFLAGS="-ffile-prefix-map=$GITHUB_WORKSPACE=/qsh -ffile-prefix-map=$cargo_home=/cargo -ffile-prefix-map=$RUNNER_TEMP=/build"
          if [ "$RUNNER_OS" = Linux ]; then export CC=musl-gcc; fi
          cargo build --release --locked -p qsh -p qshd --target "$NATIVE_TARGET"
          RUSTFLAGS="$rsa_baseline_rustflags" cargo test --locked -p sshauth --target "$NATIVE_TARGET" \
            --test rsa_file_signing --test native_rsa_backend -- --include-ignored
          if [ "$RUNNER_OS" = Linux ]; then
            dynamic=$(readelf -d "target/$NATIVE_TARGET/release/qsh" "target/$NATIVE_TARGET/release/qshd")
            if grep -q NEEDED <<< "$dynamic"; then
              echo 'musl products import dynamic libraries' >&2
              exit 1
            fi
          else
            dynamic=$(otool -L "target/$NATIVE_TARGET/release/qsh" "target/$NATIVE_TARGET/release/qshd")
            if grep -Ei 'lib(ssl|crypto).*dylib' <<< "$dynamic"; then
              echo 'products import an unqualified dynamic native backend' >&2
              exit 1
            fi
          fi
          for target in "$NATIVE_TARGET"; do
            for program in qsh qshd; do
              binary="target/$target/release/$program"
              python3 -I -B scripts/check-native-verifier-paths.py \
                "$binary" "$GITHUB_WORKSPACE" "$cargo_home" "$RUNNER_TEMP"
            done
          done
          if [ "$RUNNER_OS" = Linux ]; then
            strip "target/$NATIVE_TARGET/release/qsh" "target/$NATIVE_TARGET/release/qshd"
          else
            strip "target/$NATIVE_TARGET/release/qsh"
            strip "target/$NATIVE_TARGET/release/qshd"
          fi
          for target in "$NATIVE_TARGET"; do
            for program in qsh qshd; do
              binary="target/$target/release/$program"
              python3 -I -B scripts/check-native-verifier-paths.py \
                "$binary" "$GITHUB_WORKSPACE" "$cargo_home" "$RUNNER_TEMP"
            done
          done
          for target in "$NATIVE_TARGET"; do
            for program in qsh qshd; do
              binary="target/$target/release/$program"
              python3 -I -B - "$binary" "$target" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys
          binary = Path(sys.argv[1])
          data = binary.read_bytes()
          print(json.dumps(dict(schema=1, kind='native-product-path-qualification',
                                target=sys.argv[2], program=binary.name, profile='release',
                                stage='stripped', sha256=hashlib.sha256(data).hexdigest(),
                                bytes=len(data)), sort_keys=True, separators=(',', ':')))
          PY
            done
          done

  # Ownership gets its own budget; measured crypto/product prerequisites used
  # almost 31 minutes of the shared 35-minute Intel job before owner compilation.
  darwin-owner-intel:
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.mode == 'pty-eof-build' || inputs.mode == 'pty-eof-control')) }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            name: Native Intel Darwin process owner
            cache_suffix: ''
          # Native qualification of the xnu-12377 (macOS 26) admission (#551).
          - runner: macos-26-intel
            name: Native Intel Darwin process owner on macOS 26
            cache_suffix: -macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      NATIVE_TARGET: x86_64-apple-darwin
      QSH_RUNNER_LABEL: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Bind the Intel owner checkout
        shell: bash
        run: |
          set -euo pipefail
          checkout_sha=$(git rev-parse HEAD)
          test "$checkout_sha" = "$GITHUB_SHA"
          # The preflight bounds each query to ten seconds. On a fresh macOS 26
          # Intel image the first /usr/bin/git call (an xcrun shim) took 7.6s
          # and a repeat 0.6s; an earlier preflight refused that first query
          # after 12s (#551). Pay the one-time cost here, unbounded and checked.
          shim_sha=$(/usr/bin/git rev-parse HEAD)
          test "$shim_sha" = "$checkout_sha"
          printf 'darwin223 checkout=%s event=%s run=%s attempt=%s\n' "$checkout_sha" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
      - name: Observe the Intel Darwin runtime
        shell: bash
        timeout-minutes: 2
        run: |
          python3 -I -B - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path
          import re
          import sys

          QUERIES = (
              ('checkout', ('/usr/bin/git', 'rev-parse', 'HEAD')),
              ('kernel_version', ('/usr/sbin/sysctl', '-n', 'kern.version')),
              ('osrelease', ('/usr/sbin/sysctl', '-n', 'kern.osrelease')),
              ('os_build', ('/usr/sbin/sysctl', '-n', 'kern.osversion')),
              ('hw_machine', ('/usr/sbin/sysctl', '-n', 'hw.machine')),
              ('uname_machine', ('/usr/bin/uname', '-m')),
              ('os_version', ('/usr/bin/sw_vers', '-productVersion')),
          )
          class Refused(Exception):
              def __init__(self, query):
                  self.query = query if query in {name for name, _ in QUERIES} else 'checkout'

          def token(value, pattern, limit, query):
              if type(value) is not str or len(value) > limit or re.fullmatch(pattern, value) is None:
                  raise Refused(query)
              return value

          def kernel(value):
              day = r'(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)'
              month = r'(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)'
              date = day + ' ' + month + r' {1,2}(?:[1-9]|[12][0-9]|3[01]) (?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9] (?:[A-Z]{1,8}|[+-][0-9]{4}) [0-9]{4}'
              version = r'[0-9]{1,5}(?:\.[0-9]{1,5}){1,2}'
              revision = r'[0-9]{1,12}(?:[.~][0-9]{1,12}){0,12}'
              return token(value, 'Darwin Kernel Version ' + version + ': ' + date + '; root:xnu-' + revision + r'/RELEASE_[A-Z0-9_]{1,96}', 512, 'kernel_version')

          def build_record(values, environ):
              if type(values) is not dict or set(values) != {name for name, _ in QUERIES}:
                  raise Refused('checkout')
              sha = token(values['checkout'], r'[0-9a-f]{40}', 40, 'checkout')
              event = token(environ.get('GITHUB_SHA'), r'[0-9a-f]{40}', 40, 'checkout')
              run = token(environ.get('GITHUB_RUN_ID'), r'[1-9][0-9]{0,19}', 20, 'checkout')
              attempt = token(environ.get('GITHUB_RUN_ATTEMPT'), r'[1-9][0-9]{0,9}', 10, 'checkout')
              for name in ('hw_machine', 'uname_machine'):
                  token(values[name], r'x86_64', 32, name)
              return dict(schema=1, kind='darwin-intel-preflight', checkout_sha=sha, event_sha=event,
                          run_id=int(run), attempt=int(attempt),
                          runner_label=token(environ.get('QSH_RUNNER_LABEL'), r'macos-(?:15|26)-intel', 16, 'checkout'),
                          target='x86_64-apple-darwin', kernel_version=kernel(values['kernel_version']),
                          osrelease=token(values['osrelease'], r'[0-9]+(?:\.[0-9]+)*', 32, 'osrelease'),
                          os_build=token(values['os_build'], r'[A-Za-z0-9]+', 32, 'os_build'),
                          os_version=token(values['os_version'], r'[0-9]+(?:\.[0-9]+)*', 20, 'os_version'),
                          hw_machine=values['hw_machine'], uname_machine=values['uname_machine'])

          def collect(metadata_command, environ):
              values = {}
              for name, argv in QUERIES:
                  try:
                      raw = metadata_command(list(argv), timeout=10, category='static-tool')
                      if type(raw) is not bytes or not 0 < len(raw) <= 65536 or raw.count(b'\n') != 1 or not raw.endswith(b'\n'):
                          raise Refused(name)
                      values[name] = raw[:-1].decode('ascii')
                  except Exception:
                      raise Refused(name) from None
              return build_record(values, environ)

          def main():
              try:
                  path = Path('scripts/check-release-output.py')
                  spec = importlib.util.spec_from_file_location('_qsh_release_output', path)
                  module = importlib.util.module_from_spec(spec)
                  spec.loader.exec_module(module)
                  record = collect(module.metadata_command, os.environ)
                  line = ('DARWIN_INTEL_PREFLIGHT ' + json.dumps(record, sort_keys=True, separators=(',', ':'), ensure_ascii=True) + '\n').encode('ascii')
                  if len(line) > 2048:
                      raise Refused('kernel_version')
                  sys.stdout.buffer.write(line)
                  return 0
              except Exception as error:
                  query = error.query if isinstance(error, Refused) else 'checkout'
                  print('INTEL_PREFLIGHT_REFUSED query=' + query, file=sys.stderr)
                  return 1

          if __name__ == '__main__':
              raise SystemExit(main())
          PY
      - name: Install native owner prerequisites
        run: brew install gnupg
      - name: Build and execute the pinned owner backend
        shell: bash
        run: |
          bash scripts/qualify-openssl.sh --target "$NATIVE_TARGET" \
            --cache "$RUNNER_TEMP/native-crypto" \
            --toolchain-id "$ImageOS/$ImageVersion"
          prefix=$(bash scripts/build-openssl.sh --target "$NATIVE_TARGET" \
            --cache "$RUNNER_TEMP/native-crypto" \
            --toolchain-id "$ImageOS/$ImageVersion")
          echo "OPENSSL_DIR=$prefix" >> "$GITHUB_ENV"
          echo 'OPENSSL_STATIC=1' >> "$GITHUB_ENV"
      - name: Install qualified Rust for owner checks
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup target add "$NATIVE_TARGET"
          scripts/check-qualified-rust.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: native-owner-x86_64-apple-darwin${{ matrix.cache_suffix }}
      - name: Qualify the production Intel Darwin process owner
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          test -z "${CARGO_ENCODED_RUSTFLAGS:-}"
          cargo_home="$CARGO_HOME"
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/qsh --remap-path-prefix=$cargo_home=/cargo --remap-path-prefix=$RUNNER_TEMP=/build -C link-arg=-Wl,-oso_prefix,$GITHUB_WORKSPACE/ -Dwarnings"
          export AWS_LC_SYS_USE_SYSTEM=0
          export AWS_LC_SYS_CFLAGS="-ffile-prefix-map=$GITHUB_WORKSPACE=/qsh -ffile-prefix-map=$cargo_home=/cargo -ffile-prefix-map=$RUNNER_TEMP=/build"
          rustup component add clippy --toolchain "$RUSTUP_TOOLCHAIN"
          scripts/check-qualified-rust.sh
          rustc -vV
          runtime=$(mktemp -d "$RUNNER_TEMP/qsh-darwin-owner.XXXXXX")
          trap 'rm -rf "$runtime"' EXIT
          mkdir -m 700 "$runtime/home" "$runtime/config" "$runtime/cache" "$runtime/tmp"
          export HOME="$runtime/home" XDG_CONFIG_HOME="$runtime/config" XDG_CACHE_HOME="$runtime/cache"
          export TMPDIR="$runtime/tmp" HISTFILE=/dev/null
          select_artifact() {
            python3 -I -B - "$1" "$2" "$3" "$4" <<'PY_ARTIFACT'
          import hashlib, json, os, pathlib, sys
          root = pathlib.Path.cwd().resolve(strict=True)
          kind, features = sys.argv[3], set(sys.argv[4].split(','))
          assert kind in {'bin', 'lib'}
          manifest = root / 'qshd/Cargo.toml'
          source = root / ('qshd/src/main.rs' if kind == 'bin' else 'qshd/src/lib.rs')
          records = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
          records = [r for r in records if r.get('reason') == 'compiler-artifact'
                     and r.get('target', {}).get('name') == 'qshd'
                     and r.get('target', {}).get('kind') == [kind]
                     and r.get('executable')]
          assert len(records) == 1, 'expected one current Cargo qshd artifact'
          record = records[0]
          assert record.get('profile', {}).get('test') is (kind == 'lib')
          assert set(record['features']) == features, 'wrong fixture feature configuration'
          assert pathlib.Path(record['manifest_path']).resolve(strict=True) == manifest
          assert pathlib.Path(record['target']['src_path']).resolve(strict=True) == source
          executable = pathlib.Path(record['executable'])
          assert executable.is_absolute() and executable.is_file() and os.access(executable, os.X_OK)
          executable = executable.resolve(strict=True)
          assert (root / 'target').resolve(strict=True) in executable.parents
          sha = hashlib.sha256(executable.read_bytes()).hexdigest()
          prefix = pathlib.Path(sys.argv[2])
          prefix.with_suffix('.path').write_text(str(executable))
          prefix.with_suffix('.sha256').write_text(sha)
          receipt = dict(kind='darwin-custody-Cargo-artifact', target_kind=kind, features=sorted(features),
                         profile_test=record['profile']['test'], sha256=sha,
                         manifest_sha256=hashlib.sha256(manifest.read_bytes()).hexdigest(),
                         source_sha256=hashlib.sha256(source.read_bytes()).hexdigest())
          prefix.with_suffix('.json').write_text(json.dumps(receipt, sort_keys=True) + '\n')
          print(json.dumps(receipt, sort_keys=True))
          PY_ARTIFACT
          }
          verify_harness() {
            test "$(shasum -a 256 "$1" | awk '{print $1}')" = "$(cat "$2")"
          }
          timed() {
            local stage=$1 result
            shift
            printf 'darwin223 timing stage=%s event=start unix_seconds=%s\n' "$stage" "$(date +%s)" >&2
            if "$@"; then result=0; else result=$?; fi
            printf 'darwin223 timing stage=%s event=end unix_seconds=%s status=%s\n' "$stage" "$(date +%s)" "$result" >&2
            return "$result"
          }
          timed ordinary-daemon cargo build -p qshd --bin qshd --profile test --features test-build-labels --locked --target "$NATIVE_TARGET" --message-format=json-render-diagnostics > "$runtime/build.jsonl"
          select_artifact "$runtime/build.jsonl" "$runtime/ordinary-daemon" bin test-build-labels
          export QSH_DARWIN223_DAEMON="$(cat "$runtime/ordinary-daemon.path")"
          export QSH_DARWIN223_DAEMON_SHA256="$(cat "$runtime/ordinary-daemon.sha256")"
          timed ordinary-harness cargo test -p qshd --lib --features test-build-labels --locked --target "$NATIVE_TARGET" --no-run --message-format=json-render-diagnostics > "$runtime/ordinary-harness.jsonl"
          select_artifact "$runtime/ordinary-harness.jsonl" "$runtime/ordinary-harness" lib test-build-labels
          ordinary_harness="$(cat "$runtime/ordinary-harness.path")"
          verify_harness "$ordinary_harness" "$runtime/ordinary-harness.sha256"
          timed modern-runtime "$ordinary_harness" darwin_process_scope::native_tests::darwin223_native_ \
            --nocapture --test-threads=1 2>&1 | tee "$runtime/results.log"
          for name in \
            darwin_process_scope::native_tests::darwin223_native_noncooperative_token_exec_and_bound_exit \
            darwin_process_scope::native_tests::darwin223_native_signaled_leader_scope_uses_portable_code_one \
            darwin_process_scope::native_tests::darwin223_native_already_zombie_handshake_child_keeps_reserved_leader \
