      - name: Prepare native Intel Darwin legacy account-service restart artifacts
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export CARGO_BUILD_TARGET="$NATIVE_TARGET" HISTFILE=/dev/null
          cargo_home="$CARGO_HOME"
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/qsh --remap-path-prefix=$cargo_home=/cargo --remap-path-prefix=$RUNNER_TEMP=/build -C link-arg=-Wl,-oso_prefix,$GITHUB_WORKSPACE/ -Dwarnings"
          export AWS_LC_SYS_USE_SYSTEM=0
          export AWS_LC_SYS_CFLAGS="-ffile-prefix-map=$GITHUB_WORKSPACE=/qsh -ffile-prefix-map=$cargo_home=/cargo -ffile-prefix-map=$RUNNER_TEMP=/build"
          started=$(date +%s)
          python3 -m unittest discover -s scripts/tests -p test_released_peer_acceptance.py
          python3 scripts/released-peer-acceptance.py --service-only --prepare-only \
            --prepared-bundle "$RUNNER_TEMP/legacy-service-intel-bundle" \
            --evidence "$RUNNER_TEMP/legacy-service-intel-preparation-evidence"
          printf 'legacy-service preparation elapsed_seconds=%s\n' "$(( $(date +%s) - started ))"
      - name: Native Intel Darwin legacy account-service restart acceptance
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          umask 077
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export CARGO_BUILD_TARGET="$NATIVE_TARGET" HISTFILE=/dev/null
          cargo_home="$CARGO_HOME"
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/qsh --remap-path-prefix=$cargo_home=/cargo --remap-path-prefix=$RUNNER_TEMP=/build -C link-arg=-Wl,-oso_prefix,$GITHUB_WORKSPACE/ -Dwarnings"
          export AWS_LC_SYS_USE_SYSTEM=0
          export AWS_LC_SYS_CFLAGS="-ffile-prefix-map=$GITHUB_WORKSPACE=/qsh -ffile-prefix-map=$cargo_home=/cargo -ffile-prefix-map=$RUNNER_TEMP=/build"
          python3 scripts/released-peer-acceptance.py --service-only \
            --execute-prepared "$RUNNER_TEMP/legacy-service-intel-bundle" \
            --evidence "$RUNNER_TEMP/legacy-service-intel-evidence"
          grep -Fx '2 selected tests; 2 passed; 0 skipped' "$RUNNER_TEMP/legacy-service-intel-evidence/passed.txt"
      - name: Report native Intel Darwin legacy-service bundle lifecycle
        if: always()
        shell: bash
        run: |
          python3 -I -B - "$RUNNER_TEMP/legacy-service-intel-bundle" <<'PY_STATE'
          import json, os, stat, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          record = dict(state='not-created')
          try:
              info = root.lstat()
              if not stat.S_ISDIR(info.st_mode) or info.st_uid != os.geteuid() or stat.S_IMODE(info.st_mode) != 0o700:
                  record = dict(state='unverified-backing-retained')
              else:
                  record = dict(state='owned-backing-retained')
                  for name in ('complete.json', 'execution.claim', 'settled.json', 'payload-disposition.json'):
                      path = root / name
                      record[name] = path.is_file() and not path.is_symlink()
          except FileNotFoundError:
              pass
          print('LEGACY_SERVICE_BUNDLE '+json.dumps(record, sort_keys=True))
          PY_STATE

  system-floors:
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.mode == 'pty-eof-build' || inputs.mode == 'pty-eof-control')) }}
    name: Native system floor (${{ matrix.format }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        format: [deb, rpm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install explicit ARM emulator
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Build existing package-floor image
        env:
          FORMAT: ${{ matrix.format }}
        run: docker build -f "packaging/Dockerfile.build-$FORMAT" -t qsh-native-floor packaging
      - name: Reject untrusted RPMs and prohibit foreign scriptlets
        if: matrix.format == 'rpm'
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,exec,nosuid --tmpfs /var/tmp:rw,exec,nosuid \
            --tmpfs /var/log:rw,noexec,nosuid --tmpfs /run:rw,noexec,nosuid \
            -e HISTFILE=/dev/null -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD/packaging/bootstrap:/bootstrap:ro" \
            qsh-native-floor /usr/libexec/platform-python /bootstrap/test-sysroot.py
      - name: Qualify both GNU architectures inside the actual floor
        env:
          FORMAT: ${{ matrix.format }}
        run: |
          mkdir -p "$RUNNER_TEMP/native-floor"
          docker run --rm --user "$(id -u):$(id -g)" \
            -e CARGO_BUILD_JOBS=2 -e HISTFILE=/dev/null -e FORMAT \
            -v "$PWD:/work:ro" -v "$RUNNER_TEMP/native-floor:/native" \
            -v /usr/bin/qemu-aarch64-static:/usr/local/bin/qemu-aarch64-static:ro \
            qsh-native-floor bash -euc '
              export HOME=/native/home CARGO_HOME=/native/cargo CARGO_TARGET_DIR=/native/products
              mkdir -p "$HOME" "$CARGO_HOME" /native/source
              cp -a /work/. /native/source/
              cd /native/source
              bash scripts/qualify-openssl.sh --target x86_64-unknown-linux-gnu \
                --cache /native/products/native-crypto --toolchain-id "package-floor-$FORMAT"
              if [ "$FORMAT" = deb ]; then
                sysroot=/usr/aarch64-linux-gnu
              else
                sysroot=/usr/aarch64-linux-gnu/sys-root
              fi
              bash scripts/qualify-openssl.sh --target aarch64-unknown-linux-gnu \
                --cache /native/products/native-crypto --cc aarch64-linux-gnu-gcc \
                --ar aarch64-linux-gnu-ar --ranlib aarch64-linux-gnu-ranlib \
                --toolchain-id "package-floor-$FORMAT" \
                --runner /usr/local/bin/qemu-aarch64-static \
                --runner-arg=-L --runner-arg="$sysroot"
              # Use the existing package build and its exact glibc/PAM checks
              # to qualify linked system products, not only the native C probe.
              packaging/build-server-packages.sh --in-container "$FORMAT"
              for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
                binary="$CARGO_TARGET_DIR/$target/release/qshd"
                dynamic=$(readelf -d "$binary")
                if grep -E "NEEDED.*lib(ssl|crypto)\.so" <<< "$dynamic"; then
                  echo "system product imports an unqualified native backend" >&2
                  exit 1
                fi
              done
            '

  dispatch-mode:
    name: Validate manual mode
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Refuse unknown manual modes
        env:
          PTY_EOF_MODE: ${{ inputs.mode }}
        run: |
          python3 -I -B - <<'PY_MODE'
          import os
          if os.environ['PTY_EOF_MODE'] not in ('qualification', 'pty-eof-build', 'pty-eof-control'):
              raise SystemExit('manual mode refused')
          PY_MODE

  pty-eof-diagnostic:
    name: PTY EOF ${{ inputs.mode == 'pty-eof-build' && 'build' || 'control' }} (${{ matrix.target }})
    needs: dispatch-mode
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'pty-eof-build' || inputs.mode == 'pty-eof-control') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Install native diagnostic prerequisites
        run: brew install gnupg
      - name: Qualify the pinned diagnostic backend
        shell: bash
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bash scripts/qualify-openssl.sh --target "$NATIVE_TARGET" \
            --cache "$RUNNER_TEMP/native-crypto" \
            --toolchain-id "$ImageOS/$ImageVersion"
          prefix=$(bash scripts/build-openssl.sh --target "$NATIVE_TARGET" \
            --cache "$RUNNER_TEMP/native-crypto" \
            --toolchain-id "$ImageOS/$ImageVersion")
          echo "OPENSSL_DIR=$prefix" >> "$GITHUB_ENV"
          echo 'OPENSSL_STATIC=1' >> "$GITHUB_ENV"
      - name: Install qualified Rust for standalone controls
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup target add "$NATIVE_TARGET"
          rustup component add clippy --toolchain "$RUSTUP_TOOLCHAIN"
          scripts/check-qualified-rust.sh
      - name: Build and qualify only the fixed standalone stage
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          PTY_EOF_MODE: ${{ inputs.mode }}
        run: |
          python3 -I -B scripts/qualify-pty-eof-control.py "$PTY_EOF_MODE" "$NATIVE_TARGET"
