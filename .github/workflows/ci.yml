name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.99.1"

# Least privilege by default: this workflow only reads the repository (it
# never publishes anything). Without an explicit top-level `permissions`,
# a job with no `permissions` of its own falls back to the repository's
# default token permissions -- "read and write" on every repo created
# before February 2023 -- so `cargo install` and the build scripts of
# hundreds of third-party crates would otherwise run with a token that can
# push to this repository.
permissions:
  contents: read

# A push to an open pull request supersedes the run already in flight for
# it, so cancel that one instead of paying for both; a push to main never
# cancels another push to main (there is no prior run in the same group to
# race with in practice, and we don't want a queued main run dropped).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    name: macOS portable tests
    runs-on: macos-15
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
      HISTFILE: /dev/null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Verify the exact source commit
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          echo "Source commit: $actual (run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT)"
          test "$actual" = "$GITHUB_SHA"
      - name: Check client installation bootstrap
        run: |
          sh -n scripts/install.sh
          python3 -B -m unittest discover -s scripts/tests -p 'test_client_install_bootstrap.py'
      - name: Qualify Darwin process identity, signaling and exit primitives
        run: |
          bash scripts/qualify-darwin-direct-child.sh
          bash scripts/qualify-darwin-native-primitives.sh
      - name: Inventory existing Darwin kernel artifact metadata
        run: python3 scripts/inspect-darwin-kernel-artifacts.py
      - name: Install the toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Verify the qualified floor compiler selected by Cargo
        run: |
          compiler=$(scripts/check-qualified-rust.sh)
          printf '%s\n' "$compiler"
          grep -qx 'release: 1.98.1' <<< "$compiler"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install native build prerequisites
        run: brew install gnupg
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/native-crypto
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/*openssl*', 'scripts/openssl/*') }}
      - name: Prepare the pinned native backend
        shell: bash
        run: |
          target=$(rustc -vV | sed -n 's/^host: //p')
          prefix=$(bash scripts/build-openssl.sh --target "$target" --cache "$RUNNER_TEMP/native-crypto" --jobs 2)
          echo "OPENSSL_DIR=$prefix" >> "$GITHUB_ENV"
          echo 'OPENSSL_STATIC=1' >> "$GITHUB_ENV"
      - name: Test managed client installation on macOS
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          runtime=$(mktemp -d "$RUNNER_TEMP/qsh-client-install.XXXXXX")
          trap 'rm -rf "$runtime"' EXIT
          mkdir -m 700 "$runtime/home" "$runtime/config" "$runtime/cache" "$runtime/tmp"
          export HOME="$runtime/home" XDG_CONFIG_HOME="$runtime/config" XDG_CACHE_HOME="$runtime/cache"
          export TMPDIR="$runtime/tmp" HISTFILE=/dev/null
          unset SSH_AUTH_SOCK
          # Retained signed-release assets are not available in this job.
          # Do not opt in to ignored release-authentication acceptance tests.
          cargo test -p qsh --lib --locked client_install -- --color never \
            --skip client_install::signed_tests::production_signed_install_and_explicit_update_policy \
            2>&1 | tee "$runtime/store-policy.log"
          grep -E '^test client_install::.* \.\.\. ok$' "$runtime/store-policy.log"
          grep -E '^test result: ok\. [1-9][0-9]* passed; 0 failed;' "$runtime/store-policy.log"
          grep -Fx 'test client_install::store::tests::installation_lock_drop_releases_with_retained_descriptor_alias ... ok' "$runtime/store-policy.log"
          grep -Fx 'test client_install::store::tests::installation_lock_blocks_competitor_until_owner_drop ... ok' "$runtime/store-policy.log"
          cargo test -p qsh --lib --locked releases::client -- --color never \
            2>&1 | tee "$runtime/release-client.log"
          grep -E '^test releases::client::.* \.\.\. ok$' "$runtime/release-client.log"
          grep -E '^test result: ok\. [1-9][0-9]* passed; 0 failed;' "$runtime/release-client.log"
          cargo test -p qsh --test client_install --locked -- --color never \
            2>&1 | tee "$runtime/command.log"
          grep -F 'test managed_help_capability_pty_has_no_state ... ok' "$runtime/command.log"
          grep -F 'test development_managed_commands_pty_refuse_without_state ... ok' "$runtime/command.log"
          grep -E '^test result: ok\. [1-9][0-9]* passed; 0 failed;' "$runtime/command.log"
      - name: Test authenticated server discovery and upgrade policy on macOS
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          runtime=$(mktemp -d "$RUNNER_TEMP/qsh-server-discovery.XXXXXX")
          trap 'rm -rf "$runtime"' EXIT
          mkdir -m 700 "$runtime/home" "$runtime/config" "$runtime/cache" "$runtime/tmp"
          export HOME="$runtime/home" XDG_CONFIG_HOME="$runtime/config" XDG_CACHE_HOME="$runtime/cache"
          export TMPDIR="$runtime/tmp" HISTFILE=/dev/null
          unset SSH_AUTH_SOCK
          focused_lib() {
            local package=$1 filter=$2
            shift 2
            local output="$runtime/$package-$filter.log"
            cargo test -p "$package" --lib --locked "$@" "$filter" -- --color never \
              2>&1 | tee "$output"
            grep -E '^test .+ \.\.\. ok$' "$output"
            grep -E '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$output"
            if grep -F 'SKIPPED' "$output"; then exit 1; fi
          }
          # These tests use authenticated in-process peers or pure decisions;
          # no installed daemon, SSH agent or retained release artifact is used.
          focused_lib transport bootstrap --features tokio-driver
          grep -E '^test bootstrap_client::tests::.* \.\.\. ok$' "$runtime/transport-bootstrap.log"
          focused_lib transport generation --features tokio-driver
          focused_lib qshd server_info
          grep -F 'test server_info::tests::server_info_generation_is_shared_and_control_echoes_live_values ... ok' "$runtime/qshd-server_info.log"
          grep -F 'test transport_daemon::server_info_tests::server_info_control_reads_running_owner_without_authorization_mutation ... ok' "$runtime/qshd-server_info.log"
          focused_lib connect upgrade
          focused_lib qsh server_discovery
          focused_lib qsh recovery::discovery_tests
          focused_lib qsh recovery::pending_tests
          focused_lib qsh upgrade_offer
          focused_lib qsh authenticated_upgrade_overlay_defaults_to_postpone_and_requires_explicit_choice
          focused_lib qsh expired_upgrade_choice_neither_installs_nor_types_into_the_shell
          focused_lib qsh released_attempt_delivers_only_metadata_wakes_to_the_next_receiver
          focused_lib ssh server_info
          # This integration target owns its authenticated loopback peer and PTY;
          # it does not infer a daemon path from a Cargo sibling executable.
          cargo test -p qsh --test server_discovery --locked -- --color never \
            2>&1 | tee "$runtime/discovery-pty.log"
          grep -F 'test source_incompatible_initial_discovery_pty_shows_manual_rebuild_without_download_offer ... ok' "$runtime/discovery-pty.log"
          grep -F 'test legacy_unknown_initial_discovery_pty_keeps_ordinary_timeout_and_no_release_claim ... ok' "$runtime/discovery-pty.log"
          grep -F 'test authenticated_ordinary_rejection_cannot_cancel_initial_discovery_pty ... ok' "$runtime/discovery-pty.log"
          grep -F 'test result: ok. 3 passed; 0 failed; 0 ignored;' "$runtime/discovery-pty.log"
          if grep -F 'SKIPPED' "$runtime/discovery-pty.log"; then exit 1; fi
      - name: Qualify the production Darwin process owner
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          test -z "${CARGO_ENCODED_RUSTFLAGS:-}"
          export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }-Dwarnings"
          rustup component add clippy --toolchain "$RUSTUP_TOOLCHAIN"
          scripts/check-qualified-rust.sh
          rustc -vV
          runtime=$(mktemp -d "$RUNNER_TEMP/qsh-darwin-owner.XXXXXX")
          trap 'rm -rf "$runtime"' EXIT
          mkdir -m 700 "$runtime/home" "$runtime/config" "$runtime/cache" "$runtime/tmp"
          export HOME="$runtime/home" XDG_CONFIG_HOME="$runtime/config" XDG_CACHE_HOME="$runtime/cache"
          export TMPDIR="$runtime/tmp" HISTFILE=/dev/null
          select_artifact() {
            python3 -I -B - "$1" "$2" "$3" "$4" <<'PY_ARTIFACT'
          import hashlib, json, os, pathlib, sys
          root = pathlib.Path.cwd().resolve(strict=True)
          kind, features = sys.argv[3], set(sys.argv[4].split(','))
          assert kind in {'bin', 'lib'}
          manifest = root / 'qshd/Cargo.toml'
          source = root / ('qshd/src/main.rs' if kind == 'bin' else 'qshd/src/lib.rs')
          records = [json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines()]
          records = [r for r in records if r.get('reason') == 'compiler-artifact'
                     and r.get('target', {}).get('name') == 'qshd'
                     and r.get('target', {}).get('kind') == [kind]
                     and r.get('executable')]
          assert len(records) == 1, 'expected one current Cargo qshd artifact'
          record = records[0]
          assert record.get('profile', {}).get('test') is (kind == 'lib')
          assert set(record['features']) == features, 'wrong fixture feature configuration'
          assert pathlib.Path(record['manifest_path']).resolve(strict=True) == manifest
          assert pathlib.Path(record['target']['src_path']).resolve(strict=True) == source
          executable = pathlib.Path(record['executable'])
          assert executable.is_absolute() and executable.is_file() and os.access(executable, os.X_OK)
          executable = executable.resolve(strict=True)
          assert (root / 'target').resolve(strict=True) in executable.parents
          sha = hashlib.sha256(executable.read_bytes()).hexdigest()
          prefix = pathlib.Path(sys.argv[2])
          prefix.with_suffix('.path').write_text(str(executable))
          prefix.with_suffix('.sha256').write_text(sha)
          receipt = dict(kind='darwin-custody-Cargo-artifact', target_kind=kind, features=sorted(features),
                         profile_test=record['profile']['test'], sha256=sha,
                         manifest_sha256=hashlib.sha256(manifest.read_bytes()).hexdigest(),
                         source_sha256=hashlib.sha256(source.read_bytes()).hexdigest())
          prefix.with_suffix('.json').write_text(json.dumps(receipt, sort_keys=True) + '\n')
          print(json.dumps(receipt, sort_keys=True))
          PY_ARTIFACT
          }
          verify_harness() {
            test "$(shasum -a 256 "$1" | awk '{print $1}')" = "$(cat "$2")"
          }
          timed() {
            local stage=$1 result
            shift
            printf 'darwin223 timing stage=%s event=start unix_seconds=%s\n' "$stage" "$(date +%s)" >&2
            if "$@"; then result=0; else result=$?; fi
            printf 'darwin223 timing stage=%s event=end unix_seconds=%s status=%s\n' "$stage" "$(date +%s)" "$result" >&2
            return "$result"
          }
          timed ordinary-daemon cargo build -p qshd --bin qshd --profile test --features test-build-labels --locked --message-format=json-render-diagnostics > "$runtime/build.jsonl"
          select_artifact "$runtime/build.jsonl" "$runtime/ordinary-daemon" bin test-build-labels
          export QSH_DARWIN223_DAEMON="$(cat "$runtime/ordinary-daemon.path")"
          export QSH_DARWIN223_DAEMON_SHA256="$(cat "$runtime/ordinary-daemon.sha256")"
          timed ordinary-harness cargo test -p qshd --lib --features test-build-labels --locked --no-run --message-format=json-render-diagnostics > "$runtime/ordinary-harness.jsonl"
          select_artifact "$runtime/ordinary-harness.jsonl" "$runtime/ordinary-harness" lib test-build-labels
          ordinary_harness="$(cat "$runtime/ordinary-harness.path")"
          verify_harness "$ordinary_harness" "$runtime/ordinary-harness.sha256"
          timed modern-runtime "$ordinary_harness" darwin_process_scope::native_tests::darwin223_native_ \
            --nocapture --test-threads=1 2>&1 | tee "$runtime/results.log"
          for name in \
            darwin_process_scope::native_tests::darwin223_native_noncooperative_token_exec_and_bound_exit \
            darwin_process_scope::native_tests::darwin223_native_signaled_leader_scope_uses_portable_code_one \
            darwin_process_scope::native_tests::darwin223_native_already_zombie_handshake_child_keeps_reserved_leader \
            darwin_process_scope::native_tests::darwin223_native_classification_bracket_refuses_exec_and_one_sided_zombie \
            darwin_process_scope::native_tests::darwin223_native_silent_pty_leader_first_other_group_and_real_io_joins \
            darwin_process_scope::native_tests::darwin223_native_connected_close_stop_rebind_and_fresh_session \
            darwin_process_scope::native_tests::darwin223_native_exit_before_binding_exclusion_zombie_and_last_fork \
            darwin_process_scope::native_tests::darwin223_native_term_and_interrupt_join_real_manager_and_workers \
            darwin_process_scope::native_tests::darwin223_native_partial_descriptor_failure_retains_real_process_owner \
            darwin_process_scope::native_tests::darwin223_native_actual_daemon_replacement_reaps_parked_scope_and_fresh_session
          do
            awk -v expected="test $name ... " '
              index($0, expected) == 1 {
                seen++; pending = 1
                if ($0 == expected "ok") { passed++; pending = 0 }
                next
              }
              pending && $0 == "ok" { passed++; pending = 0 }
              END { exit !(seen == 1 && passed == 1) }
            ' "$runtime/results.log"
          done
          ! grep -F 'SKIPPED' "$runtime/results.log"
          grep -F 'test result: ok. 10 passed; 0 failed; 0 ignored;' "$runtime/results.log"
          verify_harness "$ordinary_harness" "$runtime/ordinary-harness.sha256"
          observer_name=darwin_process_scope::observation::tests::native_observer_retains_unrelated_process_in_another_session
          timed observer-runtime "$ordinary_harness" --exact "$observer_name" \
            --nocapture --test-threads=1 --color=never 2>&1 | tee "$runtime/observer-results.log"
          awk -v expected="test $observer_name ... " '
            index($0, expected) == 1 {
              seen++; pending = 1
              if ($0 == expected "ok") { passed++; pending = 0 }
              next
            }
            pending && $0 == "ok" { passed++; pending = 0 }
            END { exit !(seen == 1 && passed == 1) }
          ' "$runtime/observer-results.log"
          test "$(grep -Fc 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$runtime/observer-results.log")" -eq 1
          ! grep -F 'SKIPPED' "$runtime/observer-results.log"
          verify_harness "$ordinary_harness" "$runtime/ordinary-harness.sha256"
          timed keeper-runtime "$ordinary_harness" darwin_process_scope::keeper_tests::keeper_native_ \
            --nocapture --test-threads=1 2>&1 | tee "$runtime/keeper-results.log"
          for name in \
            darwin_process_scope::keeper_tests::keeper_native_exit37_and_pty_eof \
            darwin_process_scope::keeper_tests::keeper_native_session_death_late_fork \
            darwin_process_scope::keeper_tests::keeper_native_broker_group_intrusion \
            darwin_process_scope::keeper_tests::keeper_native_cancel_before_admit_no_application
          do
            awk -v expected="test $name ... " '
              index($0, expected) == 1 {
                seen++; pending = 1
                if ($0 == expected "ok") { passed++; pending = 0 }
                next
              }
              pending && $0 == "ok" { passed++; pending = 0 }
              END { exit !(seen == 1 && passed == 1) }
            ' "$runtime/keeper-results.log"
          done
          if grep -F 'SKIPPED' "$runtime/keeper-results.log"; then exit 1; fi
          grep -F 'test result: ok. 4 passed; 0 failed; 0 ignored;' "$runtime/keeper-results.log"
          if grep -F 'rescue=true' "$runtime/keeper-results.log"; then exit 1; fi
          test "$(grep -Fc 'case=cancel after_admit=false expired=false noapp=true app=None' "$runtime/keeper-results.log")" -eq 1
          test "$(grep -Fc 'case=cancel after_admit=true expired=false noapp=false app=Some(' "$runtime/keeper-results.log")" -eq 1
          test "$(grep -Fc 'case=cancel after_admit=false expired=true noapp=true app=None' "$runtime/keeper-results.log")" -eq 1
          timed feature-check cargo check -p qshd --lib --bin qshd --features test-darwin-keeper --locked
          timed feature-clippy cargo clippy -p qshd --lib --bin qshd --features test-darwin-keeper --locked -- -D warnings
          timed feature-daemon cargo build -p qshd --bin qshd --profile test --features test-darwin-keeper --locked --message-format=json-render-diagnostics > "$runtime/keeper-integrated-build.jsonl"
          select_artifact "$runtime/keeper-integrated-build.jsonl" "$runtime/feature-daemon" bin test-build-labels,test-darwin-keeper
          export QSH_DARWIN223_DAEMON="$(cat "$runtime/feature-daemon.path")"
          export QSH_DARWIN223_DAEMON_SHA256="$(cat "$runtime/feature-daemon.sha256")"
          printf 'keeper223 compatibility_Cargo_binary_sha256=%s source=compiled-missing\n' "$QSH_DARWIN223_DAEMON_SHA256"
          timed feature-harness cargo test -p qshd --lib --features test-darwin-keeper --locked --no-run --message-format=json-render-diagnostics > "$runtime/feature-harness.jsonl"
          select_artifact "$runtime/feature-harness.jsonl" "$runtime/feature-harness" lib test-build-labels,test-darwin-keeper
          feature_harness="$(cat "$runtime/feature-harness.path")"
          verify_harness "$feature_harness" "$runtime/feature-harness.sha256"
          timed command-terminal-contrast "$feature_harness" --ignored --exact darwin_process_scope::keeper_integration_tests::keeper_command_terminal_contrast --nocapture --test-threads=1 \
            2>&1 | tee "$runtime/keeper-command-contrast-results.log"
          awk -v expected="test darwin_process_scope::keeper_integration_tests::keeper_command_terminal_contrast ... " '
            /^test .* \.\.\. / { starts++ }
            index($0, expected) == 1 {
              seen++; pending = 1
              if ($0 == expected "ok") { passed++; pending = 0 }
              next
            }
            pending && $0 == "ok" { passed++; pending = 0 }
            END { exit !(starts == 1 && seen == 1 && passed == 1) }
          ' "$runtime/keeper-command-contrast-results.log"
          test "$(grep -Fxc 'running 1 test' "$runtime/keeper-command-contrast-results.log")" -eq 1
          test "$(grep -Fc 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$runtime/keeper-command-contrast-results.log")" -eq 1
          test "$(grep -Fxc 'keeper223 terminal kind=Command screen=false real_eof_delivered_alive=true actual_retiring_poll=Running screen_lifetime=EOF process_slot=after_IO_joins terminal=37 session=0 rescue=false' "$runtime/keeper-command-contrast-results.log")" -eq 1
          test "$(grep -Fxc 'keeper223 connected_join=normal registry=0 screen_credits=0 two_io_joins=terminal_certificate rescue=false' "$runtime/keeper-command-contrast-results.log")" -eq 1
          if grep -E 'SKIPPED|rescue=true|boundary=failure_rescue' "$runtime/keeper-command-contrast-results.log"; then exit 1; fi
          verify_harness "$feature_harness" "$runtime/feature-harness.sha256"
          timed integrated-runtime "$feature_harness" darwin_process_scope::keeper_integration_tests::keeper_integrated_ \
            --nocapture --test-threads=1 2>&1 | tee "$runtime/keeper-integrated-results.log"
          for name in \
            darwin_process_scope::keeper_integration_tests::keeper_integrated_terminal_status_and_io \
            darwin_process_scope::keeper_integration_tests::keeper_integrated_open_cancel_and_setup_failure \
            darwin_process_scope::keeper_integration_tests::keeper_integrated_close_stop_rebind_and_fresh_session \
            darwin_process_scope::keeper_integration_tests::keeper_integrated_term_interrupt_join \
            darwin_process_scope::keeper_integration_tests::keeper_integrated_actual_daemon_replacement \
            darwin_process_scope::keeper_integration_tests::keeper_integrated_foreign_sid_retains_debt
          do
            awk -v expected="test $name ... " '
              index($0, expected) == 1 {
                seen++; pending = 1
                if ($0 == expected "ok") { passed++; pending = 0 }
                next
              }
              pending && $0 == "ok" { passed++; pending = 0 }
              END { exit !(seen == 1 && passed == 1) }
            ' "$runtime/keeper-integrated-results.log"
          done
          if grep -F 'SKIPPED' "$runtime/keeper-integrated-results.log"; then exit 1; fi
          if grep -F 'rescue=true' "$runtime/keeper-integrated-results.log"; then exit 1; fi
          grep -F 'test result: ok. 6 passed; 0 failed; 0 ignored;' "$runtime/keeper-integrated-results.log"
          grep -F 'keeper223 route=keeper source=compiled-missing' "$runtime/keeper-integrated-results.log"
          for screen in false true
          do
            test "$(grep -Fxc "keeper223 terminal kind=Command screen=$screen real_eof_delivered_alive=true actual_retiring_poll=Running screen_lifetime=EOF process_slot=after_IO_joins terminal=37 session=0 rescue=false" "$runtime/keeper-integrated-results.log")" -eq 1
            test "$(grep -Fxc "keeper223 terminal kind=Shell screen=$screen eof_contract=normal_completion real_eof_delivered=true reader_join_held=true cleanup_receipts=true screen_lifetime=EOF process_slot=after_IO_joins terminal=37 session=0 rescue=false" "$runtime/keeper-integrated-results.log")" -eq 1
          done
          test "$(grep -c '^keeper223 terminal ' "$runtime/keeper-integrated-results.log")" -eq 4
          if grep -E 'SKIPPED|rescue=true|boundary=failure_rescue' "$runtime/keeper-integrated-results.log"; then exit 1; fi
          test "$(grep -Fc 'keeper223 open_executor mode=' "$runtime/keeper-integrated-results.log")" -eq 4
          grep -F 'ledger_before_setsid=true pending_interval=true refund=false replacement_refused=true foreign_signal=false voluntary_exit=true rescue=false' "$runtime/keeper-integrated-results.log"
          grep -F 'wire_STOP=ack_then_actual_exit_watch_and_consumed_wait' "$runtime/keeper-integrated-results.log"
          grep -F 'keeper223 replacement_routes old_image=' "$runtime/keeper-integrated-results.log"
      # #548: a failed keeper fixture's last manager wait is bounded. A blocked
      # wait must end the harness with native stacks from `sample`. Reuses the
      # ordinary harness features built above.
      - name: Keeper failure settlement bound
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          runtime=$(mktemp -d "$RUNNER_TEMP/qsh-keeper548.XXXXXX")
          trap 'rm -rf "$runtime"' EXIT
          export HOME="$runtime/home"
          export XDG_CONFIG_HOME="$runtime/config"
          export XDG_CACHE_HOME="$runtime/cache"
          export HISTFILE=/dev/null
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          cargo test -p qshd --lib --features test-build-labels --locked -- \
            darwin_process_scope::keeper_integration_tests::keeper548_ --nocapture --test-threads=1 \
            2>&1 | tee "$runtime/results.log"
          # Filtered on purpose, so each test is required by name instead of
          # scripts/no-silent-skips.sh, which rejects any filter.
          for name in \
            darwin_process_scope::keeper_integration_tests::keeper548_blocked_wait_returns_a_settled_task_without_diagnostics \
            darwin_process_scope::keeper_integration_tests::keeper548_blocked_wait_reports_and_ends_the_harness \
            darwin_process_scope::keeper_integration_tests::keeper548_descendants_follow_parents_and_reduce_names
          do
            awk -v expected="test $name ... " '
              index($0, expected) == 1 {
                seen++; pending = 1
                if ($0 == expected "ok") { passed++; pending = 0 }
                next
              }
              pending && $0 == "ok" { passed++; pending = 0 }
              END { exit !(seen == 1 && passed == 1) }
            ' "$runtime/results.log"
          done
          if grep -F 'SKIPPED' "$runtime/results.log"; then exit 1; fi
          grep -F 'test result: ok. 3 passed; 0 failed; 0 ignored;' "$runtime/results.log"
      - name: Compile safe libraries and inline tests
        run: >-
          cargo test --lib --no-run --locked
          -p bringup -p client -p connect -p knock -p logging
