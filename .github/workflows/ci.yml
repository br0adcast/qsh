  check:
    runs-on: ubuntu-latest
    env:
      HISTFILE: /dev/null
      # Line tables only in the test profile: backtraces keep their file
      # and line, debuggers lose variables and types. Full DWARF is most of
      # what the test executables weigh, and the whole test build has to fit
      # in a standard runner's storage (#462). Set for the job rather than a
      # step: rust-cache hashes CARGO* variables into its key, so cached
      # artifacts always match the profile they were built with.
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    # The integration tests bring up real daemons; a hang there (or
    # anywhere else in this job) would otherwise burn the default 360
    # minutes before GitHub kills it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Verify the exact source commit
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          echo "Source commit: $actual (run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT)"
          test "$actual" = "$GITHUB_SHA"

      # Disk observations (#462): runner baseline, then restored caches,
      # toolchains and native dependencies, then build output.
      - name: Disk usage at job start
        run: df -h / "$RUNNER_TEMP" /mnt 2>/dev/null || true

      - name: Install the toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Verify qualified compiler
        run: scripts/check-qualified-rust.sh

      # v2.9.2, pinned by commit so a mutable tag can't change what CI runs.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Verify pinned dependency policy tools
        run: python3 scripts/install-dependency-tools.py --directory "$RUNNER_TEMP/dependency-tools"

      - name: Dependency policy fixture controls
        env:
          QSH_TEST_DEPENDENCY_TOOLS: ${{ runner.temp }}/dependency-tools
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromName('scripts.tests.test_dependency_policy')
          count = suite.countTestCases()
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if count and result.wasSuccessful() and not result.skipped else 1)
          PY

      - name: Dependency advisories and reviewed policy
        run: >-
          python3 scripts/check-dependencies.py
          --tools-directory "$RUNNER_TEMP/dependency-tools"
          --output-directory "$RUNNER_TEMP/dependency-report"

      - name: Install nextest
        run: |
          mkdir -p "$RUNNER_TEMP/nextest"
          archive="$RUNNER_TEMP/nextest.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.148/cargo-nextest-0.9.148-x86_64-unknown-linux-gnu.tar.gz \
            --output "$archive"
          echo "223ba936714cc861a9cdedad5a8eb664dfdd69d6fbdf6cea6aa8184f523290dc  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP/nextest"
          echo "$RUNNER_TEMP/nextest" >> "$GITHUB_PATH"

      # `qshd/system` links Linux-PAM and libselinux directly, so both
      # development linkers are needed for the feature build below.
      # `binutils` is for `strip`: qshd/tests/transport_ensure_update.rs
      # strips its copy of the debug qshd below MAX_UPDATE_SIZE.
      - name: Install integration test dependencies
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev libselinux1-dev binutils patch zsh rpm rpm2cpio

      - name: Build and release script controls
        run: |
          sh -n scripts/install.sh
          python3 -B -m unittest discover -s scripts/tests -p 'test_client_install_bootstrap.py'
          python3 -m unittest discover -s scripts/tests -p 'test_build_openssl.py'
          python3 -m unittest discover -s scripts/tests -p 'test_release_version.py'
          python3 -m unittest discover -s scripts/tests -p 'test_rust_version.py'
          python3 -B -m unittest discover -s scripts/tests -p 'test_git_build_metadata.py'
          python3 -m unittest discover -s scripts/tests -p 'test_released_peer_acceptance.py'
          python3 -m unittest discover -s scripts/tests -p 'test_release_output.py'
          python3 -m unittest discover -s scripts/tests -p 'test_darwin_artifact_smoke.py'
          python3 -m unittest discover -s scripts/tests -p 'test_release_assembly.py'
          python3 -m unittest discover -s scripts/tests -p 'test_release_upload.py'
          python3 -m unittest discover -s scripts/tests -p 'test_rpm_tool.py'
          python3 -m unittest discover -s scripts/tests -p 'test_bootstrap_tools.py'
          python3 -m unittest discover -s scripts/tests -p 'test_package_dependencies.py'
          python3 -m unittest discover -s scripts/tests -p 'test_selinux_linkage.py'
          python3 -m unittest discover -s scripts/tests -p 'test_selinux_modules.py'
          python3 -m unittest discover -s scripts/tests -p 'test_selinux_module_process.py'
          python3 -m unittest discover -s scripts/tests -p 'test_selinux_provider_pre.py'
          python3 -m unittest discover -s scripts/tests -p 'test_selinux_provider_pre_delivery.py'
          python3 -m unittest discover -s scripts/tests -p 'test_selinux_module_observer.py'
          python3 -m unittest discover -s scripts/tests -p 'test_selinux_module_install.py'
          python3 -m unittest discover -s scripts/tests -p 'test_selinux_context_rows.py'
          python3 -m unittest discover -s scripts/tests -p 'test_selinux_registry.py'
          python3 -m unittest discover -s scripts/tests -p 'test_selinux_inspection.py'
          python3 -m unittest discover -s scripts/tests -p 'test_selinux_first_activation.py'
          python3 -m unittest discover -s scripts/tests -p 'test_selinux_consumer_activation.py'
          python3 -m unittest discover -s scripts/tests -p 'test_selinux_phase.py'
          python3 -m unittest discover -s scripts/tests -p 'test_selinux_rpm_query.py'
          python3 -m unittest discover -s scripts/tests -p 'test_selinux_consumer_authority_generator.py'
          python3 -B -m unittest discover -s scripts/tests -p 'test_selinux_consumer_rpm_check.py'
          python3 -I -B scripts/tests/test_selinux_consumer_rpm_check.py --native -v
          python3 -m unittest discover -s scripts/tests -p 'test_selinux_policy_build.py'
          python3 -m unittest discover -s scripts/tests -p 'test_selinux_api.py'
          python3 -m unittest discover -s scripts/tests -p 'test_selinux_files.py'
          python3 -m unittest discover -s scripts/tests -p 'test_selinux_observer.py'
          python3 -m unittest discover -s scripts/tests -p 'test_selinux_payload.py'
          python3 -m unittest discover -s scripts/tests -p 'test_selinux_references.py'
          python3 -m unittest discover -s scripts/tests -p 'test_selinux_queries.py'
          python3 -m unittest discover -s scripts/tests -p 'test_selinux_transaction.py'
          python3 -m unittest discover -s scripts/tests -p 'test_selinux_activation.py'
          python3 -m unittest discover -s scripts/tests -p 'test_selinux_activation_state.py'
          python3 -m unittest discover -s scripts/tests -p 'test_selinux_package_state.py'
          python3 -m unittest discover -s scripts/tests -p 'test_qshd_stop_guard.py'
          python3 -m unittest discover -s scripts/tests -p 'test_embed_stop_guard.py'
          python3 -m unittest discover -s scripts/tests -p 'test_shell_fixture_output.py'
          # Harness accounting only; benchmark runs and thresholds stay out of CI.
          python3 -m unittest discover -s scripts/tests -p 'test_perf_baseline.py'
          python3 -m unittest discover -s scripts/tests -p 'test_perf_history.py'
          # Functional wrapper controls only; no native three-channel run.
          python3 -I -B scripts/test_three_channel_functional.py
          QSH_TEST_NEXTEST=cargo-nextest python3 -m unittest discover -s scripts/tests -p 'test_nextest_report.py'

      # Release signing orchestration, including the real native verifier's
      # rejections; none of these controls may be skipped.
      - name: Release attestation controls
        env:
          AWS_LC_SYS_USE_SYSTEM: '0'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          cargo build --locked -p release-auth --example verify-release
          export QSH_TEST_RELEASE_VERIFIER="$PWD/target/debug/examples/verify-release"
          python3 - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('scripts/tests', pattern='test_release_attestation.py')
          count = suite.countTestCases()
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if count and result.wasSuccessful() and not result.skipped else 1)
          PY

      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y perl make gcc gnupg
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/native-crypto
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/*openssl*', 'scripts/openssl/*') }}
      - name: Prepare the pinned native backend
        shell: bash
        run: |
          target=$(rustc -vV | sed -n 's/^host: //p')
          prefix=$(bash scripts/build-openssl.sh --target "$target" --cache "$RUNNER_TEMP/native-crypto" --jobs 2)
          echo "OPENSSL_DIR=$prefix" >> "$GITHUB_ENV"
          echo 'OPENSSL_STATIC=1' >> "$GITHUB_ENV"
      - name: Disk usage after setup and cache restoration
        run: |
          df -h / "$RUNNER_TEMP" /mnt 2>/dev/null || true
          du -sh target "$HOME/.cargo" "$HOME/.rustup" "$RUNNER_TEMP" 2>/dev/null || true
      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --features qshd/system -- -D warnings
      - name: Disk usage before the test build
        run: |
          df -h / "$RUNNER_TEMP" /mnt 2>/dev/null || true
          du -sh target "$HOME/.cargo" "$HOME/.rustup" "$RUNNER_TEMP" 2>/dev/null || true

      # Each test gets its own process, isolating PAM's descriptor changes.
      # nextest.toml keeps daemon port-selection suites serial while allowing
      # independent tests to overlap. Root-only tests still run below in
      # disposable containers. Exact exclusions and source-declared ignores
      # are reported separately; any executed test emitting SKIPPED fails.
      - name: Build the exact test daemon artifact
        run: |
          cargo build -p qshd --bin qshd --locked --features system \
            --message-format=json > "$RUNNER_TEMP/qshd-artifacts.json"
      - name: Unit and integration tests
        # The runner supplies the exact daemon from the preceding Cargo JSON.
        # Shared fixtures must not discover siblings or start nested Cargo builds.
        env:
          QSH_REQUIRE_TEST_SHELLS: "1"
        run: >-
          python3 scripts/run-nextest-ci.py
          --daemon-artifacts "$RUNNER_TEMP/qshd-artifacts.json" --require-install-fixtures --
          cargo nextest run --profile ci --workspace --lib --bins --tests --example three_channel305
          --locked --features qshd/system
      - name: Disk usage after the test build and run
        if: ${{ !cancelled() }}
        run: |
          df -h / "$RUNNER_TEMP" /mnt 2>/dev/null || true
          du -sh target "$HOME/.cargo" "$HOME/.rustup" "$RUNNER_TEMP" 2>/dev/null || true

      # nextest does not run doctests.
      - name: Doc tests
        run: cargo test --workspace --doc --locked

  # The privileged tier. Everything `check` above cannot do: create and
  # remove real accounts, overwrite `/etc/pam.d/qshd`, start a real
  # `qshd serve --system` that forks a helper and drops a worker to another
  # account. Those tests exist, they are the ones the system mode is
  # dangerous without, and on a GitHub runner they do not run: each one
  # looks at its machine, decides it may not touch it, prints a `SKIPPED`
  # line to stderr and returns -- which libtest counts as a pass. Measured:
  # without root, three of the end-to-end PAM tests report "3 passed" in
  # 0.00 seconds having checked nothing. `scripts/no-silent-skips.sh` is
  # what makes that impossible to mistake for a pass here.
  container:
    # `runs-on` and the image below are pinned to the SAME Ubuntu release on
    # purpose. The test binaries are built on the runner and executed inside
    # the container, so the container's glibc (and libpam) must not be older
    # than the runner's; `ubuntu-latest` moving on first would break every
    # run of this job with a loader error that says nothing about the code.
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
      HISTFILE: /dev/null
      # The same test build as the `check` job's, on the same runner pool.
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    # The suites themselves take about two minutes all told, measured in
    # these same containers; the rest is the toolchain and the build.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Verify the exact source commit
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          echo "Source commit: $actual (run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT)"
          test "$actual" = "$GITHUB_SHA"

      - name: Install the toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Verify the qualified floor compiler selected by Cargo
        run: |
          compiler=$(scripts/check-qualified-rust.sh)
          printf '%s\n' "$compiler"
          grep -qx 'release: 1.98.1' <<< "$compiler"
      - name: Verify minimal-profile developer components
        run: |
          rustup run "$RUSTUP_TOOLCHAIN" rustfmt --version
          rustup run "$RUSTUP_TOOLCHAIN" cargo-clippy --version
      - name: Verify every workspace member declares the supported Rust floor
        run: |
          cargo metadata --no-deps --format-version 1 --locked > "$RUNNER_TEMP/workspace.json"
          python3 scripts/check-rust-version.py < "$RUNNER_TEMP/workspace.json"

      # v2.9.2, pinned by commit so a mutable tag can't change what CI runs.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      # To LINK the `system` build (see the `check` job), install both PAM
      # and libselinux development linkers. The containers already have
      # `libpam0g` and the modules
      # this tier's tests name (`pam_permit`, `pam_deny`, `pam_unix`,
      # `pam_exec`) are in the `ubuntu:24.04` base image, as are `useradd`,
      # `userdel` and `chage`. Verified by running these suites in exactly
      # that image, not assumed.
      # `jq` reads the build's JSON below. GitHub's Ubuntu images ship it,
      # but a one-line insurance against an image that stops doing so is
      # cheaper than a job that fails for want of a JSON parser.
      - name: Install system-mode link libraries
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev libselinux1-dev jq

      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y perl make gcc gnupg
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/native-crypto
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/*openssl*', 'scripts/openssl/*') }}
      - name: Prepare the pinned native backend
        shell: bash
        run: |
          target=$(rustc -vV | sed -n 's/^host: //p')
          prefix=$(bash scripts/build-openssl.sh --target "$target" --cache "$RUNNER_TEMP/native-crypto" --jobs 2)
          echo "OPENSSL_DIR=$prefix" >> "$GITHUB_ENV"
          echo 'OPENSSL_STATIC=1' >> "$GITHUB_ENV"
      - name: Disk usage after setup and cache restoration
        run: |
          df -h / "$RUNNER_TEMP" /mnt 2>/dev/null || true
          du -sh target "$HOME/.cargo" "$HOME/.rustup" "$RUNNER_TEMP" 2>/dev/null || true
      - name: Allocation bounds on the package compiler
        run: cargo test -p qshd --lib --locked screen_budget::allocation_bounds -- --nocapture

      # Build the personal daemon before the system build: the latter must
      # remain at target/debug/qshd for the existing PAM/link/runtime consumers.
      - name: Minimum Rust personal daemon and standalone transport surfaces
        run: |
          cargo build -p qshd --bin qshd --locked
          cargo check -p transport --lib --no-default-features --locked

      # Built on the runner rather than in the containers, so the cache
      # applies and each container starts with nothing to do but run one
      # binary. `--message-format=json` is how the executables are found:
      # the file names carry a metadata hash, and picking "the newest
      # `target/debug/deps/<name>-*`" would sooner or later pick a stale
      # one left by another build.
      - name: Build all workspace test targets at the supported Rust floor
        run: |
          cargo test --workspace --features qshd/system --locked --no-run \
            --message-format=json > "$RUNNER_TEMP/build.json"
      - name: Disk usage after the test build
        if: ${{ !cancelled() }}
        run: |
          df -h / "$RUNNER_TEMP" /mnt 2>/dev/null || true
          du -sh target "$HOME/.cargo" "$HOME/.rustup" "$RUNNER_TEMP" 2>/dev/null || true

      # `scripts/check-pam-linkage.sh` ran only by hand until now. Given a
      # PATH it builds nothing and reads one already-built file: does it
      # import a libpam symbol at a version node newer than LIBPAM_1.0, or
      # name pam_start_confdir at all? Either would mean a daemon that does
      # not start on Linux-PAM 1.3.1 -- Ubuntu 20.04, RHEL 8 -- which is a
      # release blocker found at release time instead of here.
      #
      # The step above has just built exactly such a file (`CARGO_BIN_EXE_qshd`
      # is why every test binary needs it), so this costs one `readelf` and
      # one `nm` and no build at all. It is the whole of what the script's
      # cheap check covers, and deliberately NOT the script's full tree run:
      # that one builds qshd four ways in three cargo target directories the
      # cache does not reach, which belongs in a job that has a reason to
      # pay for it -- the packaging path, where
      # `packaging/build-server-packages.sh` already calls this same script
      # over each binary it is about to wrap.
      - name: Build the disposable PAM group fixture
        run: scripts/build-test-pam-modules.sh "$GITHUB_WORKSPACE/target/test-fixtures/pam"

      - name: The shipped binary asks libpam for nothing newer than LIBPAM_1.0
        run: scripts/check-pam-linkage.sh target/debug/qshd

      # ONE BINARY PER FRESH CONTAINER, which is a requirement and not a
      # convenience: these suites share account names and the machine's one
      # `/etc/pam.d/qshd`, `install_service_file` has no inverse (a suite
      # leaves behind whichever stack it installed last, often `pam_deny`),
      # they share `/var/log/qshd/qshd.log`, and the mutex that makes them
      # take turns is per test binary. A `container:` on this job would run
      # every step in ONE container and give none of that.
      #
      # Per container:
      #   --init          something must reap orphans, or a test mistakes a
      #                   zombie for a live worker. Without it the test
      #                   binary itself is pid 1 and reaps nothing.
      #   --cap-add=SYS_PTRACE
      #                   `serve_system_split` alone needs it: two of its
      #                   tests call `pidfd_getfd`, which Docker's default
      #                   seccomp profile refuses (`Operation not
      #                   permitted`) the same way it refuses `ptrace`.
      #                   Given to all of them because it costs nothing in a
      #                   container that is thrown away.
      #   -v ...:ro       the repository at its own absolute path: a test
      #                   binary has `qshd`'s path baked in
      #                   (`CARGO_BIN_EXE_qshd`). Read-only, because nothing
      #                   here writes into the tree -- the daemons write to
      #                   the container's `/tmp`, `/etc/pam.d` and
      #                   `/var/log`.
      #   no -i           nothing here reads stdin, and a container without
      #                   it has none to read. NOT what keeps the daemon's
      #                   stdin off a socket: `start_daemon_with` spawns
      #                   every daemon with `.stdin(Stdio::null())` and has
      #                   since before this tier existed, which is what stops
      #                   `serve_system_split`'s search for the helper's two
      #                   seam sockets from finding an inherited third.
      #
      # Every run is `--nocapture` (a skip line printed to stderr reaches
      # the log no other way) at one thread (the account mutex is a
      # fallback, not the plan, and libpam damages a process's descriptor
      # table), goes to a file, and the file goes through
      # `scripts/no-silent-skips.sh`.
      - name: Run the root-gated suites, one binary per fresh container
        run: |
          set -uo pipefail
          logs="$RUNNER_TEMP/tier"
          mkdir -p "$logs"
          failures=0

          # Other workspace packages now emit artifacts too; identify qshd
          # from the already-checked metadata before matching its target/kind.
          qshd_package=$(jq -er '
            .workspace_members as $members |
            [.packages[] | select(.name == "qshd" and
              (.id as $id | $members | index($id)))] |
            if length == 1 then .[0].id else error("expected one qshd workspace package") end
          ' "$RUNNER_TEMP/workspace.json")

          # The named cache and SSH ownership fixtures use qsh here.
          qsh_package=$(jq -er '
            .workspace_members as $members |
            [.packages[] | select(.name == "qsh" and
              (.id as $id | $members | index($id)))] |
            if length == 1 then .[0].id else error("expected one qsh workspace package") end
          ' "$RUNNER_TEMP/workspace.json")

          # The executable for one cargo target: `<kind>` tells the library
          # test binary (`lib`) apart from the `qshd` binary's own (`bin`),
          # which share a target name.
          binary() {
            package=$qshd_package
            if [ "$1" = test ] && [ "$2" = ssh_known_hosts_authority_privilege ]; then
              package=$qsh_package
            fi
            jq -r --arg package "$package" --arg kind "$1" --arg name "$2" \
              'select(.reason == "compiler-artifact" and .profile.test == true
                      and .package_id == $package
                      and .target.name == $name and (.target.kind | index($kind)))
               | .executable' "$RUNNER_TEMP/build.json" | tail -n 1
          }

          # run_suite <kind> <target name> [--require NAME ...] [name of a test that may skip ...]
          #
          # Every suite runs even if an earlier one failed, and the step
          # fails at the end: identifying every broken binary is useful;
          # stopping at the first hides the remaining results. The
          # `if` around the pipeline is what suspends `-e` for it (GitHub
          # runs this script under `bash -e`), so a failing suite is
          # counted rather than fatal on the spot.
          #
          # `bad` is per binary and never more than 1. A run whose tests
          # failed AND whose log then failed the skip check is ONE broken
          # binary, and adding to the total twice for it made the closing
          # line say two binaries had broken when one had -- a number
          # nobody could reconcile with the individual groups above it.
          run_suite() {
            kind=$1; name=$2; shift 2
            bin=$(binary "$kind" "$name")
            if [ -z "$bin" ] || [ ! -x "$bin" ]; then
              echo "::error::no $kind test binary was built for $name"
              failures=$((failures + 1))
              return
            fi
            bad=0
            # Only the library's IPv6 PAM policy fixture needs to add a
            # documentation address inside its disposable network namespace.
            fixture_env=()
            if [ "$kind" = lib ] || [ "$name" = system_mode_pam ]; then
              fixture_env=(-e "QSHD_TEST_PAM_GROUP_MODULE=$GITHUB_WORKSPACE/target/test-fixtures/pam/session_groups.so")
            fi
            # The native monitor fixture runs without a compiler or PAM headers.
            if [ "$kind" = lib ]; then
              fixture_env+=(-e "QSHD_TEST_PAM_OWNED_MODULE=$GITHUB_WORKSPACE/target/test-fixtures/pam/owned_session.so")
            fi
            if [ "$name" = system_mode_policies ]; then
              fixture_env+=(-e QSHD_TEST_PAM_FAMILY=debian)
            fi
            network_caps=()
            if [ "$kind" = lib ]; then network_caps=(--cap-add=NET_ADMIN); fi
            echo "::group::$name"
            # Merge the test's streams before Docker multiplexes them.
            # Host-side 2>&1 alone can reorder libtest's result and a skip
            # diagnostic, making a complete run look like a missing test.
            if docker run --rm --init --cap-add=SYS_PTRACE "${network_caps[@]}" "${fixture_env[@]}" \
              -e QSHD_TEST_DISPOSABLE_HOST=1 \
              -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" -w "$GITHUB_WORKSPACE" \
              ubuntu:24.04 sh -c 'exec "$@" 2>&1' sh "$bin" --test-threads=1 --nocapture \
              2>&1 | tee "$logs/$name.log"
            then :; else
              echo "::error::$name failed in its container"
              bad=1
            fi
            # Run even when the tests failed: "which tests did not run at
            # all" is a different answer from "which failed", and a broken
            # run is exactly when both are worth having.
            scripts/no-silent-skips.sh "$logs/$name.log" "$@" || bad=1
            if [ "$name" = ssh_known_hosts_authority_privilege ]; then
              grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$logs/$name.log" || bad=1
            fi
            failures=$((failures + bad))
            echo "::endgroup::"
          }

          # The integration suites gated by `feature = "system"` at file
          # scope. NOTHING in them may skip: they are the reason this job
          # exists.
          #
          # Each also names, via --require, the one test whose disappearance
          # would hollow the suite out to a pass that checks nothing. This is
          # a different failure from a SKIPPED line or an #[ignore]: nothing
          # here is skipped, refused, or filtered -- the test is not in the
          # binary at all, so `N passed` just prints a smaller N and every
          # test still there still says `ok`. Measured: a rename, or
          # `#[cfg(any())]` standing in for a deletion, on any one of these
          # five makes its suite report fewer passed and exit 0, unchanged
          # from before this line existed. Deliberately not "every test in
          # the suite" -- a list that has to be edited each time a test is
          # added to a suite stops getting read -- see
          # scripts/no-silent-skips.sh for what --require checks and why a
          # plain `grep -q "test NAME ... ok"` does not work under
          # --nocapture.
          # Only this exact qsh library fixture runs as root. Never run the whole library.
          run_qsh_cache_privilege() {
            cache_privilege=releases::cache::privilege_tests::release_cache_root_readonly_and_foreign_owner_boundaries
            cache_bin=$(jq -ser --arg package "$qsh_package" '
              [.[] | select(.reason == "compiler-artifact" and .profile.test == true
                and .package_id == $package and .target.name == "qsh"
                and (.target.kind | index("lib"))) | .executable] | unique |
              if length == 1 and .[0] != null then .[0] else error("expected one exact qsh library artifact") end
            ' "$RUNNER_TEMP/build.json")
            if [ -z "$cache_bin" ] || [ ! -x "$cache_bin" ]; then
              echo "::error::no exact qsh library cache ownership test binary was built"
              failures=$((failures + 1))
              return
            fi
            bad=0
            if docker run --rm --init -e QSHD_TEST_DISPOSABLE_HOST=1 \
              -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" -w "$GITHUB_WORKSPACE" \
              ubuntu:24.04 sh -c 'exec "$@" 2>&1' sh "$cache_bin" \
              --exact "$cache_privilege" --test-threads=1 --nocapture \
              2>&1 | tee "$logs/release_cache_authority_privilege.log"
            then :; else bad=1; fi
            python3 scripts/run-nextest-ci.py \
              --check-exact-libtest "$logs/release_cache_authority_privilege.log" \
              --require-exact-test "$cache_privilege" || bad=1
            grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' \
              "$logs/release_cache_authority_privilege.log" || bad=1
            failures=$((failures + bad))
          }
          run_qsh_cache_privilege
          run_suite test ssh_known_hosts_authority_privilege \
            --require ssh_known_hosts_real_owner_read_and_append_boundaries
          run_suite test serve_system_split \
            --require the_worker_runs_as_its_configured_account \
            --require helper_status143_real_parent_endpoint_is_root_only_and_worker_does_not_inherit_it \
            --require worker_no_new_privs::worker67_no_new_privs_does_not_restrict_helper_or_user_exec \
            --require a_monitor_holds_no_seam_and_the_worker_still_sees_the_end
          run_suite test system_mode_accounts \
            --require authorization_template_characterization::configured_fixed_template_shares_authorization_with_independent_root_gate \
            --require authorization_template_characterization::configured_per_name_template_separates_the_selected_key_files \
            --require authorization_template_characterization::configured_shared_home_template_shares_authorization_with_independent_root_gate \
            --require two_accounts_each_get_their_own_shell \
            --require attacker_controlled_authorization_is_refused
          run_suite test system_mode_pam \
            --require an_expired_account_is_refused \
            --require pam_receives_only_the_account_group_baseline \
            --require shell_keeps_groups_established_by_pam \
            --require pam_can_remove_all_supplementary_groups \
            --require pam_groups_are_isolated_between_logins \
            --require pam_group_teardown_uses_the_opening_monitor
          run_suite test system_mode_policies \
            --require new_pam_sessions_obey_both_nologin_markers \
            --require executed_children_receive_account_audit_identity \
            --require executed_children_receive_per_account_limits \
            --require retained_login_keeps_policy_until_a_new_incarnation \
            --require required_audit_failure_refuses_before_exec \
            --require required_limits_failure_refuses_before_exec
          run_suite test system_mode_stop \
            --require term_retains_helper_until_successful_pam_close \
            --require int_retains_helper_until_successful_pam_close \
            --require failed_pam_close_keeps_service_exit_nonzero
          run_suite test system_mode_shell \
            --require the_system_mode_serves_a_shell_over_the_seam
          run_suite test authorized_keys_privilege \
            --require the_effective_account_is_restored_even_when_the_read_fails \
            --require personal_authorized_keys_enforces_real_account_and_root_ownership

          # This package-specific owner boundary uses the existing workspace
          # build metadata, with an exact package/target lookup rather than
          # widening the qshd-only artifact helper or compiling another matrix.
          sshauth_package=$(jq -er '
            .workspace_members as $members |
            [.packages[] | select(.name == "sshauth" and
              (.id as $id | $members | index($id)))] |
            if length == 1 then .[0].id else error("expected one sshauth workspace package") end
          ' "$RUNNER_TEMP/workspace.json")
          pin_bin=$(jq -r --arg package "$sshauth_package" '
            select(.reason == "compiler-artifact" and .profile.test == true
              and .package_id == $package and .target.name == "qsh_pin_authority_privilege"
              and (.target.kind | index("test"))) | .executable
          ' "$RUNNER_TEMP/build.json")
          if [ -z "$sshauth_package" ] || [ -z "$pin_bin" ] || [ ! -x "$pin_bin" ]; then
            echo "::error::no exact sshauth QSH pin ownership test binary was built"
            failures=$((failures + 1))
          else
            echo '::group::QSH pin ownership boundary'
            if docker run --rm --init -e QSH_PIN_TEST_DISPOSABLE_HOST=1 \
              -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" -w "$GITHUB_WORKSPACE" \
              ubuntu:24.04 sh -c 'exec "$@" 2>&1' sh "$pin_bin" --test-threads=1 --nocapture \
              2>&1 | tee "$logs/qsh_pin_authority_privilege.log"
            then :; else failures=$((failures + 1)); fi
            scripts/no-silent-skips.sh "$logs/qsh_pin_authority_privilege.log" \
              --require qsh_pin_real_account_root_read_and_mutation_boundaries || failures=$((failures + 1))
            echo '::endgroup::'
          fi

          # The library tests, where the nine `skip_unless_root` tests in
          # `helper/server.rs` live -- and four tests that must NOT run as
          # root, each because root would make the very call they expect to
          # fail succeed. Those four are named here, and they are not
          # skipped everywhere: the `check` job above runs this same binary
          # as an ordinary account, where all four do their work.
          #
          # `--ignored 85` is the exact compiled system-library body count:
          # the prior 75 plus ten isolated host-policy verifier bodies. Each
          # required host529_policy parent below reexecs exactly one body and
          # requires that body's successful one-test result. These component
          # checks do not substitute for privileged PAM/service qualification.
          # native_observer_process remains an isolated exit-only observer role.
          # Its required native_observer_retains_unrelated_process parent below
          # drives marker/liveness, drop-without-kill and exact exit.
          # The owned worker stage-barrier body's four parents remain required.
          # The deleted-cwd body is in qshd's binary test target, not this
          # library binary. Keep the strict count and require both library
          # wrappers below so a missing body or wrapper fails visibly.
          # private_creation_body is owned by
          # log::tests::permissions::log280_private_creation_and_safe_aliases,
          # which requires its child's successful one-test result.
          # Keep the strict count: a new isolated body requires deliberate review.
          #
          # One --require for this binary too, not the zero an earlier
          # version of this comment said was enough. `qshd/src/serve.rs`
          # carries about a dozen `#[test]` functions gated on `#[cfg(feature
          # = "system")]` -- `the_system_flag_is_accepted_and_moves_the_host_key`
          # and its neighbours, plus two more nested under `mod
          # silent_helper` -- the same risk this task closes for the seven
          # suites above, just diluted among ~399 tests instead of living in
          # a binary of its own. Renaming or deleting any one of them still
          # moves `399 passed` to `398 passed`, unnoticed by anything else in
          # this file: the binary AS A WHOLE is never at risk of the
          # "compiles to nothing" failure the seven suites were, since it
          # always carries the crate's few hundred ordinary unit tests
          # regardless of this feature -- but that is a claim about the
          # whole binary, not about every test inside it, and saying only
          # the first half used to read as though there were nothing here to
          # guard at all.
          #
          # `the_system_flag_is_accepted_and_moves_the_host_key` is named
          # below as one canary out of that dozen: the simplest of them (no
          # PAM, no helper process, a synchronous parse-and-assert), and
          # about as close to "why the --system flag exists at all" as a
          # unit test gets. Naming the rest of the dozen here is the more
          # thorough version of this fix and a reasonable follow-up, not done
          # in this pass; the cost of leaving them unguarded is the same
          # exposure this comment used to claim did not exist -- any of them
          # could still vanish from a `399 passed` run unnoticed -- just
          # smaller by the one test this line now does cover.
          #
          # The 75 isolated bodies are a separate matter and get no
          # --require: each is #[ignore]d here BY DESIGN and re-run as a
          # child process by a parent test, so it never produces a `test
          # NAME ... ok` line in THIS binary's own log at all -- a --require
          # on one of them could never pass in this job.
          run_suite lib qshd --ignored 85 \
            --require helper::server::tests::host_policy::host529_policy_bad_bounds_wrong_nonce_and_shared_child_cap_refuse_before_fork \
            --require helper::server::tests::host_policy::host529_policy_cancelled_consumer_and_deadline_retain_real_child_until_wait \
            --require helper::server::tests::host_policy::host529_policy_current_account_and_root_restrictions_are_rechecked \
            --require helper::server::tests::host_policy::host529_policy_forged_signature_and_wrong_key_refuse \
            --require helper::server::tests::host_policy::host529_policy_key_revocation_between_issue_and_consume_is_current \
            --require helper::server::tests::host_policy::host529_policy_late_real_verdict_after_cancel_or_revocation_cannot_grant \
            --require helper::server::tests::host_policy::host529_policy_nonce_cannot_be_redirected_to_legacy_login \
            --require helper::server::tests::host_policy::host529_policy_nonce_replay_expiry_shared_capacity_and_recovery \
            --require helper::server::tests::host_policy::host529_policy_real_auth_and_two_policy_checks_do_not_create_logins \
            --require helper::server::tests::host_policy::host529_policy_verdict_before_reap_lost_consumer_stays_charged \
            --require process_scope::observation::tests::native_observer_retains_unrelated_process_in_another_session \
            --require control::peer_tests::control_peer_root_client_rejects_foreign_server \
            --require control::peer_tests::control_peer_foreign_client_rejects_root_server \
            --require transport_daemon::peer_tests::control_peer_root_server_rejects_foreign_client \
            --require transport_daemon::peer_tests::control_peer_foreign_server_rejects_root_client \
            --require serve::tests::the_system_flag_is_accepted_and_moves_the_host_key \
            --require helper::monitor::tests::pam_access_matches_ipv4_source_cidrs_with_explicit_fallbacks \
            --require helper::monitor::tests::pam_access_matches_ipv6_source_cidrs_with_explicit_fallbacks \
            --require log::tests::path_diagnostics_relative_preparation_rotates_after_detach_cwd_change \
            --require log::tests::path_diagnostics_foreground_failure_warns_once_and_survives_in_status \
            --require helper::server::tests::worker_parent::worker508_pre_stage_stop_is_retained_without_publication \
            --require helper::server::tests::worker_parent::worker508_init_failure_before_stage_acceptance_settles \
            --require helper::server::tests::worker_parent::worker508_post_stage_unread_stop_settles_failed \
            --require helper::server::tests::worker_parent::worker508_terminal_before_pending_send_suppresses_stop \
            drop_worker_privileges_refuses_without_root \
            own_capability_sets_parses_and_reports_none_for_an_ordinary_process \
            an_undeliverable_signal_is_reported_to_the_helper \
            a_rotation_that_cannot_rename_is_reported_and_bounds_file_growth

          [ "$failures" -eq 0 ] || {
            echo "::error::$failures of 8 test binaries failed, skipped a test or left one out"
            exit 1
          }
