name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.99.1"

# Least privilege by default: this workflow only reads the repository (it
# never publishes anything). Without an explicit top-level `permissions`,
# a job with no `permissions` of its own falls back to the repository's
# default token permissions -- "read and write" on every repo created
# before February 2023 -- so `cargo install` and the build scripts of
# hundreds of third-party crates would otherwise run with a token that can
# push to this repository.
permissions:
  contents: read

# A push to an open pull request supersedes the run already in flight for
# it, so cancel that one instead of paying for both; a push to main never
# cancels another push to main (there is no prior run in the same group to
# race with in practice, and we don't want a queued main run dropped).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    name: macOS portable tests
    runs-on: macos-14
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
      HISTFILE: /dev/null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Verify the exact source commit
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          echo "Source commit: $actual (run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT)"
          test "$actual" = "$GITHUB_SHA"
      - name: Qualify Darwin process identity, signaling and exit primitives
        run: |
          bash scripts/qualify-darwin-direct-child.sh
          bash scripts/qualify-darwin-native-primitives.sh
      - name: Inventory existing Darwin kernel artifact metadata
        run: python3 scripts/inspect-darwin-kernel-artifacts.py
      - name: Install the toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Verify the qualified floor compiler selected by Cargo
        run: |
          compiler=$(scripts/check-qualified-rust.sh)
          printf '%s\n' "$compiler"
          grep -qx 'release: 1.98.1' <<< "$compiler"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install native build prerequisites
        run: brew install gnupg
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/native-crypto
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/*openssl*', 'scripts/openssl/*') }}
      - name: Prepare the pinned native backend
        shell: bash
        run: |
          target=$(rustc -vV | sed -n 's/^host: //p')
          prefix=$(bash scripts/build-openssl.sh --target "$target" --cache "$RUNNER_TEMP/native-crypto" --jobs 2)
          echo "OPENSSL_DIR=$prefix" >> "$GITHUB_ENV"
          echo 'OPENSSL_STATIC=1' >> "$GITHUB_ENV"
      - name: Compile safe libraries and inline tests
        run: >-
          cargo test --lib --no-run --locked
          -p bringup -p client -p connect -p knock -p logging
          -p prediction -p render -p ssh -p terminal -p terminal-size
      - name: Native client log-path authority and rotation tests
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          runtime=$(mktemp -d "$RUNNER_TEMP/qsh-log-authority.XXXXXX")
          trap 'rm -rf "$runtime"' EXIT
          export HOME="$runtime/home"
          export XDG_CONFIG_HOME="$runtime/config"
          export XDG_CACHE_HOME="$runtime/cache"
          export HISTFILE=/dev/null
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          cargo test -p logging --lib --locked -- --nocapture --test-threads=1 \
            2>&1 | tee "$runtime/results.log"
          scripts/no-silent-skips.sh "$runtime/results.log" \
            --require file_path_tests::authority_leaf_aliases_never_modify_outside_sentinels \
            --require file_path_tests::authority_generic_parent_is_never_repaired \
            --require file_path_tests::authority_declared_parent_and_file_are_repaired \
            --require file_path_tests::authority_failed_or_unestablished_repair_never_authorizes_a_write \
            --require file_path_tests::authority_search_only_ancestor_needs_no_directory_read_permission \
            --require file_path_tests::authority_trusted_absolute_and_relative_directory_aliases_work \
            --require file_path_tests::authority_directory_alias_count_is_bounded \
            --require file_path_tests::authority_fifo_leaf_is_refused_without_blocking_or_parent_repair \
            --require file_path_tests::authority_darwin_var_alias_is_traversed_natively \
            --require diagnostic_tests::diagnostics_escape_controls_and_bound_multibyte_output \
            --require diagnostic_tests::diagnostics_preserve_non_utf8_path_bytes_without_terminal_controls \
            --require diagnostic_tests::diagnostics_preserve_permission_and_io_error_kinds_with_component \
            --require file_path_tests::diagnostics_name_unsafe_component_and_condition_without_mutating_it \
            --require file_path_tests::diagnostics_report_nonregular_leaf_and_keep_safe_open_working \
            --require file_path_tests::route_held_file_metadata_changes_are_refused_and_recover \
            --require file_path_tests::route_observed_metadata_change_after_refresh_prevents_append \
            --require file_path_tests::route_rotation_refuses_aliases_and_preserves_outside_metadata \
            --require file_path_tests::route_declared_alias_replacement_revalidates_ancestors_even_for_same_inode \
            --require file_path_tests::route_relative_path_is_captured_before_later_cwd_changes \
            --require tests::two_sinks_two_threads_keep_lines_whole \
            --require file::tests::rotation_bound_failed_reopen_does_not_grow_retained_inode_and_recovers \
            --require file::tests::rotation_bound_failed_rename_drops_until_rotation_recovers \
            --require file::tests::rotation_bound_missing_or_replaced_parent_does_not_extend_old_file \
            --require file::tests::rotation_bound_oversize_zero_and_exact_fit_preserve_whole_records \
            --require file::tests::rotation_bound_existing_oversize_file_is_not_truncated_or_extended_on_failure \
            --require file::tests::rotation_bound_independent_writers_have_a_finite_race_bound_and_recover \
            --require authority::tests::declared_parent_is_the_negation_of_the_session_refusal \
            --require authority::tests::an_alias_target_is_followed_up_to_the_limit \
            --require authority::tests::a_verified_alias_is_read_whole_and_rechecked \
            --require authority::tests::a_repair_handle_is_the_pinned_directory_itself
          grep -F 'test result: ok. 51 passed; 0 failed; 0 ignored;' "$runtime/results.log"
      - name: Release cache authority on macOS
        shell: bash
        run: |
          set -euo pipefail
          runtime=$(mktemp -d "$RUNNER_TEMP/qsh-cache-authority.XXXXXX")
          trap 'rm -rf "$runtime"' EXIT
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export HOME="$runtime/home" XDG_CONFIG_HOME="$runtime/config" XDG_CACHE_HOME="$runtime/cache"
          export HISTFILE=/dev/null
          mkdir -m 700 -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          cargo test -p qsh --lib --locked cache_authority_ -- --nocapture --test-threads=1 \
            2>&1 | tee "$runtime/storage.log"
          for name in \
            releases::cache::storage::tests::cache_authority_lock_policy_and_binding_are_checked \
            releases::cache::storage::tests::cache_authority_reads_are_bounded_and_nonfollowing \
            releases::cache::storage::tests::cache_authority_root_walk_preserves_raw_search_and_alias_bounds \
            releases::cache::storage::tests::cache_authority_substitution_refuses_read_and_mutation \
            releases::cache::storage::tests::cache_authority_publication_keeps_one_lock_and_pointer_last \
            releases::cache::storage::tests::cache_authority_cleanup_never_removes_replacements; do
            grep -F "test $name ... ok" "$runtime/storage.log"
          done
          if grep -q 'SKIPPED' "$runtime/storage.log"; then exit 1; fi
          grep -F 'test result: ok. 6 passed; 0 failed; 0 ignored;' "$runtime/storage.log"
          cargo test -p qsh --test releases --locked cache_authority_ -- --nocapture --test-threads=1 \
            2>&1 | tee "$runtime/releases.log"
          for name in \
            cache_authority_rejects_writable_cache_but_keeps_verified_online_install \
            cache_authority_preserves_safe_public_modes_and_root_aliases; do
            grep -F "test $name ... ok" "$runtime/releases.log"
          done
          if grep -q 'SKIPPED' "$runtime/releases.log"; then exit 1; fi
          grep -F 'test result: ok. 2 passed; 0 failed; 0 ignored;' "$runtime/releases.log"
      - name: Native client session-slot authority and inheritance tests
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          runtime=$(mktemp -d "$RUNNER_TEMP/qsh-session-slots.XXXXXX")
          trap 'rm -rf "$runtime"' EXIT
          export HOME="$runtime/home"
          export XDG_CONFIG_HOME="$runtime/config"
          export XDG_CACHE_HOME="$runtime/cache"
          export HISTFILE=/dev/null
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          cargo test -p qsh --lib --locked sessions -- --nocapture --test-threads=1 \
            2>&1 | tee "$runtime/results.log"
          for name in \
            sessions::tests::slot139_planted_leaves_cannot_change_outside_objects \
            sessions::tests::slot139_directory_repair_requires_explicit_intent \
            sessions::tests::group_writable_session_authority_is_refused_without_repair \
            sessions::tests::slot139_bounded_trim_and_read_failures_have_distinct_results \
            sessions::tests::slot139_replacement_refuses_displaced_routes_and_keeps_lock \
            sessions_store::tests::slot139_traversal_preserves_aliases_and_raw_paths \
            sessions_store::tests::slot139_nonregular_owner_and_alias_bounds_are_checked \
            sessions_store::tests::slot139_substitution_and_failed_repairs_preserve_sentinels \
            sessions::tests::inheritance::slot125_owner_drop_releases_the_replacement_while_a_child_is_pre_exec \
            sessions::tests::inheritance::slot125_a_forked_copy_cannot_unlock_the_live_parent \
            sessions::tests::inheritance::slot125_failed_token_replacement_retains_ownership_until_drop \
            sessions::tests::tuple_framing_preserves_exact_names_without_path_or_length_collisions \
            sessions::tests::path_diagnostics_unavailable_store_warns_once_and_keeps_usable_token \
            sessions::tests::path_diagnostics_failed_initial_write_retains_token_and_lock_with_warning \
            sessions::tests::legacy_records_are_never_claimed_or_changed_even_when_locked \
            sessions::tests::exhausting_one_login_does_not_consume_anothers_slots; do
            # --nocapture diagnostics may split a test's name and bare ok.
            awk -v expected="test $name ... " '
              index($0, expected) == 1 {
                seen++; pending = 1
                if ($0 == expected "ok") { passed++; pending = 0 }
                next
              }
              pending && $0 == "ok" { passed++; pending = 0 }
              END { exit !(seen == 1 && passed == 1) }
            ' "$runtime/results.log"
          done
          grep -F 'test result: ok. 28 passed; 0 failed; 0 ignored;' "$runtime/results.log"
          if grep -Fq 'SKIPPED' "$runtime/results.log"; then
            echo '::error::native session-slot tests reported a runtime skip' >&2
            exit 1
          fi
      - name: Native SSH known-host authority and caller tests
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          runtime=$(mktemp -d "$RUNNER_TEMP/qsh-ssh-host-authority.XXXXXX")
          trap 'rm -rf "$runtime"' EXIT
          export HOME="$runtime/home" XDG_CONFIG_HOME="$runtime/config" XDG_CACHE_HOME="$runtime/cache"
          export HISTFILE=/dev/null
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          cargo test -p qsh --lib --locked known_hosts::tests:: -- --color never --nocapture --test-threads=1 \
            2>&1 | tee "$runtime/results.log"
          for name in \
            known_hosts::tests::ssh_host_authority_reads_refuse_unsafe_and_special_evidence \
            known_hosts::tests::ssh_host_authority_public_aliases_missing_and_raw_routes \
            known_hosts::tests::ssh_host_authority_complete_reads_preserve_parser_and_bindings \
            known_hosts::tests::ssh_host_authority_append_preserves_target_alias_hardlink_and_modes \
            known_hosts::tests::ssh_host_authority_append_tail_and_write_share_one_object \
            known_hosts::tests::ssh_host_authority_append_read_errors_are_not_ignored \
            known_hosts::tests::ssh_host_authority_creation_is_exclusive_and_never_repairs \
            known_hosts::tests::non_utf8_line_does_not_hide_the_file \
            known_hosts::tests::revoked_in_system_file_removes_known_from_user_file \
            known_hosts::tests::wildcards_and_negation_work_like_openssh \
            known_hosts::tests::hashed_entries_match \
            known_hosts::tests::io_failure_is_not_an_absent_optional_store \
            known_hosts::tests::permission_errors_preserve_path_and_source_for_either_store; do
            grep -Fx "test $name ... ok" "$runtime/results.log"
          done
          grep -F 'test result: ok. 42 passed; 0 failed; 0 ignored;' "$runtime/results.log"
          if grep -Fq SKIPPED "$runtime/results.log"; then exit 1; fi
          cargo test -p qsh --lib --locked ssh_step::tests::unreadable_stores_stop_foreground_and_background_before_ssh -- --exact --color never --nocapture \
            2>&1 | tee "$runtime/caller.log"
          grep -Fx 'test ssh_step::tests::unreadable_stores_stop_foreground_and_background_before_ssh ... ok' "$runtime/caller.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$runtime/caller.log"
          if grep -Fq SKIPPED "$runtime/caller.log"; then exit 1; fi
      - name: Compile the bringup standalone target boundary
        run: |
          echo "bringup bring_up/install real-daemon fixtures are Linux-only (pidfd, procfs, Linux tools); they do not execute on macOS."
          cargo check --all-targets -p bringup --locked
      - name: Host key publication and inherited handover on macOS
        shell: bash
        run: |
          runtime=$(mktemp -d "$RUNNER_TEMP/qsh-host-key.XXXXXX")
          trap 'rm -rf "$runtime"' EXIT
          mkdir -p "$runtime/config" "$runtime/cache"
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export HOME="$runtime" XDG_CONFIG_HOME="$runtime/config" XDG_CACHE_HOME="$runtime/cache"
          set -o pipefail
          cargo test -p qshd --lib --locked host_key:: -- --nocapture 2>&1 | tee "$runtime/results.log"
          # This job executes only the portable library selection. Require the
          # real rename race and injected unsupported-operation controls too.
          for name in \
            host_key::tests::concurrent_creators_return_the_same_published_identity \
            host_key::publication_flow_tests::losing_creator_loads_pinned_winner_after_parent_replacement \
            host_key::publication_flow_tests::unsupported_exclusive_rename_never_falls_back_to_link_publication
          do
            grep -F "test $name ... ok" "$runtime/results.log"
          done
          cargo test -p qshd --lib --locked log280_ -- --nocapture --test-threads=1 --color=never \
            2>&1 | tee "$runtime/log-permission-results.log"
          for name in \
            log::tests::permissions::log280_private_creation_and_safe_aliases \
            log::tests::permissions::log280_permission_failures_refuse_initial_and_rotated_sinks \
            log::tests::permissions::log280_path_replacement_cannot_redirect_permissions \
            log::tests::permissions::log280_unsuitable_or_unconfirmed_held_files_are_not_repaired; do
            # --nocapture diagnostics may split a test's name and bare ok.
            awk -v expected="test $name ... " '
              index($0, expected) == 1 {
                seen++; pending = 1
                if ($0 == expected "ok") { passed++; pending = 0 }
                next
              }
              pending && $0 == "ok" { passed++; pending = 0 }
              END { exit !(seen == 1 && passed == 1) }
            ' "$runtime/log-permission-results.log"
          done
          grep -F 'test result: ok. 4 passed; 0 failed; 0 ignored;' "$runtime/log-permission-results.log"
          if grep -Fq 'SKIPPED' "$runtime/log-permission-results.log"; then
            echo '::error::native daemon log permission tests reported a runtime skip' >&2
            exit 1
          fi
          # Execute the portable handover boundary on the native kernel too:
          # anonymous tempfile, sockaddr layout, executable inode and renamed
          # Unix bind paths must all be exercised, without skipped cases.
          cargo test -p qshd --test handover_validation --locked -- --nocapture 2>&1 | tee "$runtime/handover-results.log"
          for name in \
            malformed_handover_is_refused_before_ownership_or_mutation \
            invalid_socket_or_allowlist_cannot_rename_or_unlink_during_resume
          do
            grep -F "test $name ... ok" "$runtime/handover-results.log"
          done
          grep -F 'validated 35 isolated handover cases' "$runtime/handover-results.log"
          grep -F 'test result: ok. 2 passed; 0 failed; 0 ignored;' "$runtime/handover-results.log"
          # This purpose-built harness runs on its process's main thread before
          # forking; libtest's worker threads cannot provide that contract.
          cargo test -p qshd --test detach_process --locked 2>&1 | tee "$runtime/detach-results.log"
          grep -F 'validated independent EOF and lock-release observations' "$runtime/detach-results.log"
          grep -F 'validated 10 isolated detachment cases' "$runtime/detach-results.log"
          grep -F 'validated bounded parent wait and partial-ready cleanup' "$runtime/detach-results.log"
          grep -F 'validated 8 closed-stdio runtime preconditions' "$runtime/detach-results.log"
      - name: Native control peer-account tests
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          runtime=$(mktemp -d "$RUNNER_TEMP/qsh-control-peer.XXXXXX")
          trap 'rm -rf "$runtime"' EXIT
          export HOME="$runtime/home"
          export XDG_CONFIG_HOME="$runtime/config"
          export XDG_CACHE_HOME="$runtime/cache"
          export HISTFILE=/dev/null
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          # Real foreign-UID qualification runs in the Linux disposable-root
          # tier; this native job exercises kernel same-UID and failure seams.
          cargo test -p qshd --lib --locked peer_tests:: -- --nocapture \
            --skip control::peer_tests::control_peer_root_client_rejects_foreign_server \
            --skip control::peer_tests::control_peer_foreign_client_rejects_root_server \
            --skip transport_daemon::peer_tests::control_peer_root_server_rejects_foreign_client \
            --skip transport_daemon::peer_tests::control_peer_foreign_server_rejects_root_client \
            2>&1 | tee "$runtime/results.log"
          for test in \
            control::peer_tests::control_peer_account_policy_has_no_root_or_group_bypass \
            control::peer_tests::control_peer_same_account_uses_kernel_credentials \
            control::peer_tests::control_client_rejects_peer_before_sending_request \
            transport_daemon::peer_tests::control_server_rejects_peer_before_read_or_dispatch \
            transport_daemon::peer_tests::control_peer_same_account_handler_uses_kernel_credentials; do
            grep -F "test $test ... ok" "$runtime/results.log"
          done
          grep -F 'test result: ok. 5 passed; 0 failed; 0 ignored;' "$runtime/results.log"
          if grep -Fq 'SKIPPED' "$runtime/results.log"; then
            echo '::error::native control peer-account tests reported a runtime skip' >&2
            exit 1
          fi
          cargo test -p qshd --lib --locked control::path_tests:: -- --nocapture --test-threads=1 \
            2>&1 | tee "$runtime/path-results.log"
          for test in \
            control::path_tests::directory_untrusted_parent_refuses_lock_without_mutation \
            control::path_tests::directory_trust_failure_is_not_no_daemon \
            control::path_tests::directory_safe_modes_and_aliases_are_not_repaired \
            control::path_tests::directory_trusted_missing_endpoint_does_not_create_parents \
            control::path_tests::directory_transaction_refuses_replacement_for_every_request_and_reuse \
            control::path_tests::directory_existing_stage_alias_never_unlinks_outside_sentinel \
            control::path_tests::directory_unrelated_final_entries_are_not_replaced \
            control::path_tests::directory_existing_same_pid_stage_is_not_cleaned_speculatively \
            control::path_tests::directory_search_only_ancestor_is_supported_without_chmod \
            control::path_tests::directory_cleanup_uses_owned_parent_not_replacement_route \
            control::path_tests::directory_stage_boundaries_refuse_replacement_without_outside_mutation \
            control::path_tests::directory_publication_failure_cleans_stage_and_preserves_unrelated_entry \
            control::path_tests::directory_changed_staged_socket_permissions_are_not_published \
            control::path_tests::directory_lock_wait_never_adopts_a_replacement_parent \
            control::path_tests::directory_observed_stage_alias_before_chmod_cannot_touch_sentinel \
            control::path_tests::directory_sweep_refuses_a_replaced_candidate_name \
            control::path_tests::directory_connect_infrastructure_error_is_not_no_daemon \
            control::path_tests::directory_post_publication_failure_cleans_only_its_owned_socket \
            control::path_tests::directory_relative_socket_spelling_survives_a_long_owned_cwd; do
            grep -F "test $test ... ok" "$runtime/path-results.log"
          done
          grep -F 'test result: ok. 19 passed; 0 failed; 0 ignored;' "$runtime/path-results.log"
          if grep -Fq 'SKIPPED' "$runtime/path-results.log"; then
            echo '::error::native control path tests reported a runtime skip' >&2
            exit 1
          fi
      - name: Portable bringup SSH identity tests
        run: cargo test -p bringup --test ssh_identity --locked
      - name: Portable inline SSH bootstrap tests
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          runtime=$(mktemp -d "$RUNNER_TEMP/qsh-inline-bootstrap.XXXXXX")
          trap 'rm -rf "$runtime"' EXIT
          export HOME="$runtime/home"
          export XDG_CONFIG_HOME="$runtime/config"
          export XDG_CACHE_HOME="$runtime/cache"
          export HISTFILE=/dev/null
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          # The real Sandbox and its helper checks remain Linux-only; this
          # selection compiles qsh's lib tests and runs its portable fake server.
          cargo test -p qsh --lib --locked climb::bootstrap_tests:: -- --nocapture --test-threads=1 \
            2>&1 | tee "$runtime/results.log"
          for name in \
            climb::bootstrap_tests::background_ssh_rejects_a_foreign_ready_key_and_retries_the_same_route \
            climb::bootstrap_tests::background_ssh_rejects_a_conflicting_pin_on_the_returned_port \
            climb::bootstrap_tests::background_ssh_cannot_publish_from_an_unreadable_endpoint_pin_store \
            climb::bootstrap_tests::an_ssh_bootstrap_grant_is_bound_to_the_exact_route_port_and_stage \
            climb::bootstrap_tests::foreground_replacement_cannot_adopt_another_ssh_returned_daemon_key \
            climb::bootstrap_tests::ssh_first_memory_recovery_ignores_corrupt_store_and_rechecks_qsh_identity \
            climb::bootstrap_tests::ssh_first_mismatched_or_cancelled_bootstrap_never_publishes \
            climb::bootstrap_tests::ssh_first_new_connection_is_empty_and_foreign_identity_cannot_inherit \
            climb::bootstrap_tests::ssh_first_origin_uses_ssh_port_and_established_evidence_is_immutable \
            climb::bootstrap_tests::ssh_first_selected_identity_publishes_without_store_and_replacement_retains_it \
            climb::bootstrap_tests::ssh_first_wrong_origin_or_unauthenticated_peer_cannot_publish; do
            awk -v expected="test $name ... " '
              index($0, expected) == 1 {
                seen++; pending = 1
                if ($0 == expected "ok") { passed++; pending = 0 }
                next
              }
              pending && $0 == "ok" { passed++; pending = 0 }
              END { exit !(seen == 1 && passed == 1) }
            ' "$runtime/results.log"
          done
          grep -F 'test result: ok. 11 passed; 0 failed; 0 ignored;' "$runtime/results.log"
          if grep -Fq 'SKIPPED' "$runtime/results.log"; then
            echo '::error::portable inline SSH bootstrap tests reported a runtime skip' >&2
