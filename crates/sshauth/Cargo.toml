[package]
name = "sshauth"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
transport = { path = "../transport" }
# Pinned exactly: this is security-relevant parsing and verification, and the
# feature set below is what enables ed25519/ecdsa/rsa verification. `encryption`
# is unused by this task's verifier but is needed by the next task's
# passphrase-protected FileSigner, which lives in this same crate -- leave it.
ssh-key = { version = "=0.6.7", default-features = false, features = ["std", "alloc", "ed25519", "p256", "p384", "rsa", "encryption"] }
ssh-encoding = "=0.2.0"
signature = "=2.2.0"
# Used by known_hosts.rs for the file format and the server-key fingerprint.
# Deliberately NOT pinned exactly like the three crates above: those parse
# multiple untrusted key/signature formats, where a version bump could
# silently change what is accepted; these are single-purpose, stable-API
# hashing/encoding with nothing to reinterpret, so an ordinary minor-version
# range is the considered choice, not an inconsistency.
base64 = "0.22"
sha2 = "0.10"
# `flock(2)` for known_hosts.rs's advisory pin lock (Unix only). Already a
# transitive dependency of the workspace at this exact version, so this adds
# no new crate to the supply chain -- just a direct edge to one already there.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
rand_core = { version = "0.6", features = ["getrandom"] }
# Only for fabricating a genuine rsa-sha2-256 signature in a test: ssh-key's
# own `Signer` impl for RSA keys always signs with SHA-512.
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
